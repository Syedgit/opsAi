<!DOCTYPE html>
<html lang="en" data-app-shell="app">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <meta name="color-scheme" content="light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="opsAi">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icon-180.png">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-startup-image" href="/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="stylesheet" href="/app-shell.css?v=4">
    <link rel="stylesheet" href="/app-ui.css?v=2">
    <script src="/app-shell.js?v=3"></script>
    <title>Sign Up - opsAi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* Tokens from /app-ui.css */
        
        .auth-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 36px 32px;
            width: 100%;
            max-width: 420px;
            margin-top: auto;
            margin-bottom: auto;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .auth-header h1 {
            font-size: clamp(1.5rem, 4vw, 1.85rem);
            font-weight: 700;
            letter-spacing: var(--title-tracking);
            color: var(--text);
            margin-bottom: 8px;
            line-height: 1.2;
        }
        
        .auth-header p {
            color: var(--text-light);
            font-size: 16px;
        }
        
        .logo-link {
            display: block;
            width: fit-content;
            margin: 0 auto 24px;
            line-height: 0;
            text-decoration: none;
        }
        .logo-link img {
            height: 52px;
            width: auto;
            max-width: 280px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-light);
            font-weight: 500;
            font-size: 13px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-light);
            font-size: 16px;
            min-height: 44px;
            font-family: inherit;
            color: var(--text);
            transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: var(--focus-ring);
        }
        
        .btn-primary {
            width: 100%;
            background: var(--primary) !important;
            background-image: none !important;
            color: #fff;
            padding: 14px 20px;
            border: none;
            border-radius: var(--radius-pill);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            min-height: 50px;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark) !important;
        }
        
        .btn-primary:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        
        .error-message {
            background: #fee;
            color: var(--error);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-light);
            font-size: 14px;
        }
        
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 16px;
        }
        
        .loading.show {
            display: block;
        }
        
        @media (max-width: 480px) {
            .auth-container { padding: 28px 20px; }
        }
        .password-hint {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }
    </style>
</head>
<body class="ops-auth-page">
    <div id="appSplash" aria-hidden="true"><img src="/icon-192.png" alt=""><span>opsAi</span></div>
    <div class="auth-container">
        <a href="/" class="logo-link"><img src="/logo.jpg" alt="Operation Intelligence"></a>
        
        <div class="auth-header">
            <h1>Create Account</h1>
            <p id="signupSub">14 days free. No card. Then $25 per business per month.</p>
        </div>
        
        <div class="error-message" id="errorMessage" role="alert"></div>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required autocomplete="name" placeholder="Your name">
            </div>
            
            <div class="form-group" id="emailGroup">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="your@email.com">
            </div>
            
            <div class="form-group" id="passwordGroup">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="••••••••" minlength="8">
                <div class="password-hint">Must be at least 8 characters</div>
            </div>

            <div class="form-group" id="passwordConfirmGroup">
                <label for="passwordConfirm">Confirm Password</label>
                <input type="password" id="passwordConfirm" name="passwordConfirm" required autocomplete="new-password" placeholder="••••••••" minlength="8">
            </div>
            
            <button type="submit" class="btn-primary" id="submitBtn">Start free trial</button>
        </form>
        
        <div class="loading" id="loading">Creating account...</div>
        
        <div class="auth-footer">
            Already have an account? <a href="/login">Sign in</a>
            <p style="margin-top:12px;font-size:13px;line-height:1.4;">Started with WhatsApp? Sign in with WhatsApp, then add email under <strong>More</strong> — don’t create a second account.</p>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('signupForm');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const params = new URLSearchParams(window.location.search);
        const waToken = params.get('wa');

        function showError(text) {
            errorMessage.style.background = '#fee';
            errorMessage.style.color = '#e74c3c';
            errorMessage.textContent = text;
            errorMessage.classList.add('show');
        }

        if (waToken) {
            document.getElementById('signupSub').textContent =
                'WhatsApp verified. Add your name — no password needed.';
            ['emailGroup', 'passwordGroup', 'passwordConfirmGroup'].forEach(function (id) {
                const el = document.getElementById(id);
                el.style.display = 'none';
                el.querySelectorAll('input').forEach(function (input) { input.required = false; });
            });
            submitBtn.textContent = 'Create account';
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            if (!name) {
                showError('Name is required');
                return;
            }

            let body;
            if (waToken) {
                body = { wa: waToken, name };
            } else {
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const passwordConfirm = document.getElementById('passwordConfirm').value;
                if (password.length < 8) {
                    showError('Password must be at least 8 characters');
                    return;
                }
                if (password !== passwordConfirm) {
                    showError('Passwords do not match');
                    return;
                }
                body = { name, email, password, passwordConfirm };
            }
            
            errorMessage.classList.remove('show');
            submitBtn.disabled = true;
            loading.classList.add('show');
            
            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(body),
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    if (data.user) {
                        try { localStorage.setItem('user', JSON.stringify(data.user)); } catch (e) {}
                    }
                    window.location.href = '/onboarding';
                    return;
                }
                showError(data.error || 'Signup failed. Please try again.');
            } catch (error) {
                showError('Network error. Please check your connection and try again.');
            } finally {
                submitBtn.disabled = false;
                loading.classList.remove('show');
            }
        });
        
        // Check if already logged in
        fetch('/api/auth/me').then(function (res) {
            if (res.ok) window.location.href = '/dashboard';
        }).catch(function () {});
    </script>
</body>
</html>
