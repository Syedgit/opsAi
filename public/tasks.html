        if (el.id === 'logoutBtn') {
            if (window.opsai && window.opsai.logout) window.opsai.logout();
            else location.href = '/login';
            return;
        }
        if (el.classList.contains('tab')) { view = el.dataset.view; editing = null; note('', ''); if (view === 'inspection') { loadInspection(); } else if (board) render(); return; }
        if (el.hasAttribute('data-new')) { editing = {}; render(); document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' }); return; }
        if (el.hasAttribute('data-cancel-edit')) { editing = null; render(); return; }
        if (el.dataset.edit) {
            editing = board.templates.find(function (t) { return t.id === el.dataset.edit; }) || null;
            render(); if (editing) document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
            return;
        }
        if (el.dataset.delete) {
            const t = board.templates.find(function (x) { return x.id === el.dataset.delete; });
            if (!t || !confirm('Delete "' + t.title + '"? Open reminders for it stop. Past results stay in the score.')) return;
            if (await act({ action: 'delete', id: t.id }, 'Task deleted.')) load();
            return;
        }
        if (el.dataset.close) {
            if (await act({ action: 'close', runId: el.dataset.close })) load();
            return;
        }
        if (el.hasAttribute('data-run-now')) {
            el.disabled = true;
            await act({ action: 'run_now' }, function (r) { return 'Checked now: ' + r.alerted + ' new alert(s), ' + r.reminded + ' reminder(s).'; });
            load();
            return;
        }
        if (el.dataset.approve) {
            if (!confirm('Accept this photo and mark the task done?')) return;
            if (await act({ action: 'approve', runId: el.dataset.approve }, 'Photo accepted. Task marked done.')) load();
            return;
        }
        if (el.dataset.saveWa) {
            const id = el.dataset.saveWa;
            const nameEl = document.querySelector('[data-wa-name="' + id + '"]');
            const phoneEl = document.querySelector('[data-wa-phone="' + id + '"]');
            const roleEl = document.querySelector('[data-wa-role="' + id + '"]');
            if (await act({ action: 'update_whatsapp_person', id: id, name: nameEl ? nameEl.value : '', phoneE164: phoneEl ? phoneEl.value : '', role: roleEl ? roleEl.value : undefined }, 'WhatsApp person saved.')) load();
            return;
        }
        if (el.dataset.removeWa) {
            if (!confirm('Remove this WhatsApp number from the business? They will not be recognized until you add them again.')) return;
            if (await act({ action: 'remove_whatsapp_person', id: el.dataset.removeWa }, 'WhatsApp person removed.')) load();
            return;
        }
        if (el.id === 'copySheetsEmail') {
            const emailEl = document.getElementById('sheetsShareEmail');
            if (emailEl && navigator.clipboard) navigator.clipboard.writeText(emailEl.textContent || '');
            return;
        }
        if (el.id === 'clearGoogleSheet') {
            if (!confirm('Stop writing confirmed WhatsApp entries to this Google Sheet?')) return;
            if (await act({ action: 'clear_google_sheet' }, 'Google Sheet disconnected.')) load();
            return;
        }
        if (el.id === 'disconnectGmail') {
            if (!confirm('Disconnect Gmail? Morning inbox digests will stop until you connect again.')) return;
            try {
                const res = await fetch('/api/connectors/gmail/disconnect', {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ storeId: storeId }),
                });
                if (res.status === 401) { location.href = '/login'; return; }
                const data = await res.json().catch(function () { return {}; });
                if (!res.ok) throw new Error(data.error || ('Server answered ' + res.status));
                if (board) board.gmail = data.gmail || { configured: true, connected: false, email: null, status: null, lastSyncAt: null, lastError: null, storeId: storeId, rules: [], builtinRules: [] };
                note('ok', 'Gmail disconnected.');
                render();
            } catch (err) {
                note('err', err.message || 'Could not disconnect Gmail.');
            }
            return;
        }
        if (el.getAttribute('data-gmail-rule-del')) {
            const ruleId = el.getAttribute('data-gmail-rule-del');
            if (!confirm('Remove this Gmail alert rule?')) return;
            try {
                const res = await fetch('/api/connectors/gmail/rules?storeId=' + encodeURIComponent(storeId), {
                    method: 'DELETE',
                    headers: authHeaders(),
                    body: JSON.stringify({ id: ruleId, storeId: storeId }),
                });
                if (res.status === 401) { location.href = '/login'; return; }
                const data = await res.json().catch(function () { return {}; });
                if (!res.ok) throw new Error(data.error || ('Server answered ' + res.status));
                if (board && data.gmail) board.gmail = data.gmail;
                note('ok', 'Alert rule removed.');
                render();
            } catch (err) {
                note('err', err.message || 'Could not remove rule.');
            }
            return;
        }
        if (el.getAttribute('data-admin-panel')) {
            adminPanel = el.getAttribute('data-admin-panel');
            render();
            return;
        }
        if (el.id === 'enrollAiChat') {
            if (!confirm('Enable Quinn (Books) for this business? Add-on is about $' + ((board.aiChat && board.aiChat.monthlyUsd) || 20) + '/business/mo when billing is live.')) return;
            if (await act({ action: 'set_agents', books: true }, 'Quinn (Books) enabled for this business.')) load();
            return;
        }
        if (el.id === 'unenrollAiChat') {
            if (!confirm('Turn off Quinn (Books) for this business?')) return;
            if (await act({ action: 'set_agents', books: false }, 'Quinn (Books) turned off.')) load();
            return;
        }
        if (el.id === 'setAgentAutonomy') {
            const next = el.getAttribute('data-autonomy') || 'draft_only';
            if (await act({ action: 'set_agents', autonomy: next }, next === 'auto_remind' ? 'Follow-up may auto-remind.' : 'Autonomy set to draft-only.')) load();
            return;
        }
        if (el.id === 'saveSlackTool' || el.id === 'saveEmailTool') {
            const emailBox = document.getElementById('emailDigestEnabled');
            const slackBox = document.getElementById('slackEnabled');
            const emailTo = document.getElementById('emailDigestTo');
            const slackChannel = document.getElementById('slackChannelId');
            const tools = Object.assign({ whatsapp: true }, (board.channels && board.channels.tools) || {});
            if (slackBox) tools.slack = slackBox.checked;
            if (emailBox) tools.email = emailBox.checked;
            if (await act({
                action: 'set_channels',
                tools: tools,
                emailDigestEnabled: emailBox ? emailBox.checked : !!tools.email,
                emailDigestTo: emailTo && emailTo.value.trim() ? emailTo.value.trim() : null,
                slackEnabled: slackBox ? slackBox.checked : !!tools.slack,
                slackChannelId: slackChannel && slackChannel.value.trim() ? slackChannel.value.trim() : null
            }, el.id === 'saveSlackTool' ? 'Slack saved.' : 'Email digest saved.')) load();
            return;
        }
        if (el.getAttribute('data-agent-toggle') === 'staff') {
            const turnOn = el.getAttribute('data-agent-on') === '1';
            if (!turnOn && !confirm('Turn off Staff? Shift task proof on WhatsApp will stop for this business until you turn it back on.')) return;
            if (await act({ action: 'set_agents', staff: turnOn }, turnOn ? 'Staff agent on.' : 'Staff agent off.')) load();
            return;
        }
        if (el.dataset.removeDash) {
            if (!confirm('Remove this person’s dashboard access to this business?')) return;
            if (await act({ action: 'remove_dashboard_member', userId: el.dataset.removeDash }, 'Dashboard access removed.')) load();
            return;
        }
        if (el.hasAttribute('data-deactivate-store')) {
            if (!confirm('Remove this business from the dashboard? Past reports stay saved.')) return;
            if (await act({ action: 'deactivate_store' }, 'Business removed from the dashboard.')) {
                location.href = '/dashboard';
            }
            return;
        }
        if (el.dataset.cancelReport) { importing = null; render(); return; }
        if (el.dataset.applyReport) {
            const ids = Array.prototype.map.call(document.querySelectorAll('[data-report-pick]:checked'), function (c) { return c.dataset.reportPick; });
            const r = await act({ action: 'apply_report', pdf: importing.pdf, standardIds: ids }, function (res) {
                return (res.added ? res.added + ' task(s) added. Set their times in Business admin.' : 'No tasks added.') + (res.saved ? ' Report saved.' : ' This report was already saved.');
            });
            if (r) { importing = null; loadInspection(); }
            return;
        }
        if (el.dataset.addStandard) {
            const preset = presetForId(el.dataset.addStandard);
            if (!preset) {
                note('err', 'Could not load that standard. Refresh and try again.');
                return;
            }
            editing = Object.assign({}, preset);
            delete editing.id;
            delete editing.presetId;
            delete editing.scheduleText;
            render();
            const card = document.getElementById('formCard');
            if (card) card.scrollIntoView({ behavior: 'smooth' });
            return;
        }
        if (el.dataset.editStandard) {
            editing = (board.templates || []).find(function (t) { return t.id === el.dataset.editStandard; }) || null;
            render();
            if (editing) {
                const card = document.getElementById('formCard');
                if (card) card.scrollIntoView({ behavior: 'smooth' });
            }
            return;
        }
        if (el.hasAttribute('data-pick-group')) {
            e.preventDefault();
            const group = el.getAttribute('data-pick-group');
            document.querySelectorAll('input[data-preset][data-group]').forEach(function (c) {
                if (c.getAttribute('data-group') === group) c.checked = true;
            });
            return;
        }
        if (el.id === 'addVendorBtn') {
            const rows = readVendorRows();
            if (rows.length >= 20) { note('err', 'A business can have up to 20 vendors.'); return; }
            rows.push({ name: '', category: 'other' });
            board.vendors = rows;
            render();
            return;
        }
        if (el.dataset.removeVendor !== undefined) {
            const rows = readVendorRows();
            rows.splice(Number(el.dataset.removeVendor), 1);
            board.vendors = rows;
            render();
            return;
        }
        if (el.dataset.deletePic) {
            if (!confirm('Remove this picture map? Later photos will not use those lines.')) return;
            if (await act({ action: 'delete_picture_template', id: el.dataset.deletePic }, 'Picture map removed.')) load();
            return;
        }
        if (el.dataset.picPreset) {
            const preset = (board.pictureTemplatePresets || []).find(function (p) { return p.id === el.dataset.picPreset; });
            if (!preset) return;
            fillPictureMap(preset);
            setPicMapStatus('Starter layout loaded. Rename the lines to match this business.');
            return;
        }
        if (el.id === 'addPicFieldBtn') {
            const list = document.getElementById('picFieldList');
            if (!list) return;
            if (list.querySelectorAll('[data-pic-field]').length >= 12) { note('err', 'A picture map can have up to 12 lines.'); return; }
            list.insertAdjacentHTML('beforeend', picFieldRow());
            return;
        }
        if (el.dataset.removePicField !== undefined) {
            const row = el.closest('[data-pic-field]');
            const list = document.getElementById('picFieldList');
            if (row && list && list.querySelectorAll('[data-pic-field]').length > 1) row.remove();
            return;
        }
        if (el.hasAttribute('data-import')) {
            const ids = Array.prototype.map.call(document.querySelectorAll('[data-preset]:checked'), function (c) { return c.dataset.preset; });
            if (ids.length === 0) { note('err', 'Tick at least one starter task.'); return; }
            if (await act({ action: 'import_presets', presetIds: ids }, function (r) {
                const added = r.added || 0;
                const skipped = r.skipped || 0;
                if (added === 0 && skipped > 0) return 'Those reminders are already on this business. Edit their times in the list above.';
                if (added === 0) return 'No new reminders added.';
                return added + ' reminder(s) saved for this business' + (skipped ? ' (' + skipped + ' already there)' : '') + '. Edit the times to fit your hours.';
            })) load();
            return;
        }
        if (el.dataset.photo) {
            const id = el.dataset.photo;
            const box = document.querySelector('[data-photo-box="' + id + '"]');
            el.disabled = true;
            try {
                const res = await fetch('/api/stores/tasks?' + new URLSearchParams({ storeId: storeId, photo: id }));
                if (!res.ok) throw new Error('The photo is no longer available (WhatsApp keeps photos about 30 days).');
                const img = document.createElement('img');
                img.alt = 'Proof photo';
                img.src = URL.createObjectURL(await res.blob());
                box.innerHTML = '';
                box.appendChild(img);
                el.remove();
            } catch (err) {
                box.textContent = err.message;
                el.disabled = false;
            }
        }
    });

    document.addEventListener('change', function (e) {
        if (e.target.id === 'picMapPhoto' || e.target.id === 'sampleClosePhoto') {
            const file = e.target.files && e.target.files[0];
            const preview = document.getElementById(e.target.id === 'picMapPhoto' ? 'picMapPreview' : '');
            if (preview) {
                if (!file) { preview.style.display = 'none'; preview.removeAttribute('src'); }
                else { preview.src = URL.createObjectURL(file); preview.style.display = 'block'; }
            }
            if (file) proposePictureMapFromFile(file, e.target.id === 'sampleClosePhoto' ? 'daily_close' : currentPicKind());
            return;
        }
        if (e.target.id === 'picMapKind') {
            document.querySelectorAll('#picFieldList [data-pic-field] select').forEach(function (sel) {
                const keep = sel.value;
                sel.innerHTML = purposeSelect(keep);
            });
            return;
        }
        if (e.target.id === 'reportFile') {
            const file = e.target.files && e.target.files[0];
            if (file) previewReport(file);
            return;
        }
        if (e.target.dataset && e.target.dataset.feature) {
            const ticked = Array.prototype.map.call(document.querySelectorAll('[data-preset]:checked'), function (c) { return c.dataset.preset; });
            features[e.target.dataset.feature] = e.target.checked;
            render();
            ticked.forEach(function (id) { const c = document.querySelector('[data-preset="' + id + '"]'); if (c) c.checked = true; });
            return;
        }
        if (e.target.name === 'repeats') {
            const box = document.getElementById('repeatBox');
            if (box) box.style.display = e.target.checked ? '' : 'none';
            const end = document.querySelector('#taskForm [name="endTime"]');
            const start = document.querySelector('#taskForm [name="startTime"]');
            const every = document.querySelector('#taskForm [name="repeatEveryMinutes"]');
            if (end) end.required = e.target.checked;
            if (every) every.required = e.target.checked;
            if (e.target.checked && end && !end.value && start) end.value = defaultEndAfterStart(start.value);
        }
        if (e.target.name === 'howOften' || e.target.name === 'frequency') {
            const v = e.target.value;
            const weeklyBox = document.getElementById('weeklyBox');
            const monthlyBox = document.getElementById('monthlyBox');
            const intervalBox = document.getElementById('intervalBox');
            const onceBox = document.getElementById('onceBox');
            if (weeklyBox) weeklyBox.style.display = v === 'weekly' ? '' : 'none';
            if (monthlyBox) monthlyBox.style.display = v === 'monthly' ? '' : 'none';
            if (intervalBox) intervalBox.style.display = v === 'interval' ? '' : 'none';
            if (onceBox) onceBox.style.display = v === 'once' ? '' : 'none';
        }
    });

    function readVendorRows() {
        const form = document.getElementById('vendorsForm');
        if (!form) return [];
        const names = form.querySelectorAll('[name="vendorName"]');
        const cats = form.querySelectorAll('[name="vendorCategory"]');
        return Array.prototype.map.call(names, function (n, i) {
            return { name: n.value.trim(), category: cats[i] ? cats[i].value : 'other' };
        });
    }

    document.addEventListener('submit', async function (e) {
        if (e.target.id === 'googleSheetForm') {
            e.preventDefault();
            const f = new FormData(e.target);
            if (await act({ action: 'set_google_sheet', sheet: f.get('sheet') }, 'Google Sheet connected.')) load();
            return;
        }
        if (e.target.id === 'gmailRuleForm') {
            e.preventDefault();
            const f = new FormData(e.target);
            try {
                const res = await fetch('/api/connectors/gmail/rules?storeId=' + encodeURIComponent(storeId), {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({
                        storeId: storeId,
                        label: String(f.get('label') || '').trim() || null,
                        from: String(f.get('from') || '').trim() || null,
                        contains: String(f.get('contains') || '').trim() || null,
                    }),
                });
                if (res.status === 401) { location.href = '/login'; return; }
                const data = await res.json().catch(function () { return {}; });
                if (!res.ok) throw new Error(data.error || ('Server answered ' + res.status));
                if (board && data.gmail) board.gmail = data.gmail;
                note('ok', 'Alert rule added.');
                render();
            } catch (err) {
                note('err', err.message || 'Could not add rule.');
            }
            return;
        }
        if (e.target.id === 'aiChatQuestionForm') {
            e.preventDefault();
            const f = new FormData(e.target);
            const question = String(f.get('question') || '').trim();
            const out = document.getElementById('aiChatAnswer');
            if (!question || !out) return;
            out.style.display = 'block';
            out.textContent = 'Thinking…';
            try {
                const res = await fetch('/api/stores/ask', {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ storeId: storeId, question: question }),
                });
                if (res.status === 401) { location.href = '/login'; return; }
                const data = await res.json().catch(function () { return {}; });
                if (!res.ok) throw new Error(data.error || ('Server answered ' + res.status));
                out.textContent = data.answer || 'No answer.';
            } catch (err) {
                out.textContent = err.message || 'Could not ask.';
            }
            return;
        }
        if (e.target.id === 'whatsappPersonForm') {
            e.preventDefault();
            const f = new FormData(e.target);
            if (await act({ action: 'add_whatsapp_person', name: f.get('name') || '', phoneE164: f.get('phoneE164'), role: f.get('role') }, 'WhatsApp person added.')) load();
            return;
        }
        if (e.target.id === 'dashboardMemberForm') {
            e.preventDefault();
            const f = new FormData(e.target);
            if (await act({ action: 'add_dashboard_member', email: f.get('email'), role: f.get('role') }, 'Dashboard login added.')) load();
            return;
        }
        if (e.target.id === 'vendorsForm') {
            e.preventDefault();
            const vendors = readVendorRows().filter(function (v) { return v.name; });
            if (await act({ action: 'save_vendors', vendors: vendors }, 'Vendors saved. The next order photo or list will ask the sender to confirm the vendor.')) load();
            return;
        }
        if (e.target.id === 'pictureMapForm') {
            e.preventDefault();
            const list = document.getElementById('picFieldList');
            const fields = list ? Array.prototype.map.call(list.querySelectorAll('[data-pic-field]'), function (row) {
                const inputs = row.querySelectorAll('input, select');
                return { label: inputs[0] ? inputs[0].value : '', purpose: inputs[1] ? inputs[1].value : 'ignore', note: inputs[2] ? inputs[2].value : '' };
            }).filter(function (f) { return f.label.trim(); }) : [];
            const title = (document.getElementById('picMapTitle') || {}).value || '';
            const picNote = (document.getElementById('picMapNote') || {}).value || '';
            const kind = (document.getElementById('picMapKind') || {}).value || 'daily_close';
            if (await act({
                action: 'save_picture_template',
                template: { kind: kind, title: title, note: picNote, fields: fields },
            }, function (r) {
                return r.summary ? 'Picture map saved. ' + r.summary : 'Picture map saved for this business.';
            })) load();
            return;
        }
        if (e.target.id === 'samplesForm') {
            e.preventDefault();
            const f = new FormData(e.target);
            const closeInput = document.getElementById('sampleClosePhoto');
            const invoiceInput = document.getElementById('sampleInvoicePhoto');
            const closeFile = closeInput && closeInput.files && closeInput.files[0];
            const invoiceFile = invoiceInput && invoiceInput.files && invoiceInput.files[0];
            const body = { action: 'save_samples', dailyClose: f.get('dailyClose') || '', invoice: f.get('invoice') || '' };
            try {
                if (closeFile) {
                    if (closeFile.size > MAX_REPORT_BYTES) throw new Error('Photo must be under 2.5 MB.');
                    if (!/^image\/(jpeg|png|webp|gif)$/i.test(closeFile.type)) throw new Error('Use a JPEG, PNG, or WebP photo.');
                    note('info', 'Reading Store Close photo…');
                    body.dailyCloseImage = await readFileAsBase64(closeFile);
                    body.dailyCloseMime = closeFile.type;
                }
                if (invoiceFile) {
                    if (invoiceFile.size > MAX_REPORT_BYTES) throw new Error('Photo must be under 2.5 MB.');
                    if (!/^image\/(jpeg|png|webp|gif)$/i.test(invoiceFile.type)) throw new Error('Use a JPEG, PNG, or WebP photo.');
                    note('info', 'Reading invoice photo…');
                    body.invoiceImage = await readFileAsBase64(invoiceFile);
                    body.invoiceMime = invoiceFile.type;
                }
            } catch (err) {
                note('err', err.message);
                return;
            }
            const saved = await act(body, function (r) {
                if (r.dailyCloseSample) return 'Samples saved for this business. Close wording: ' + r.dailyCloseSample;
                if (r.invoiceSample) return 'Samples saved. Invoice wording: ' + r.invoiceSample;
                return 'Samples saved. The next WhatsApp close is read against this wording.';
            });
            if (saved) load();
            return;
        }
        if (e.target.id !== 'taskForm') return;
        e.preventDefault();
        const template = readForm(e.target);
        const body = editing && editing.id ? { action: 'update', id: editing.id, template: template } : { action: 'create', template: template };
        if (await act(body, 'Task saved.')) {
            editing = null;
            if (view === 'inspection') loadInspection();
            else load();
        }
    });

    (async function init() {
        const select = document.getElementById('storeSelect');
        try {
            const res = await fetch('/api/stores', { headers: authHeaders() });
            if (res.status === 401) { location.href = '/login'; return; }
            const data = await res.json();
            const stores = Array.isArray(data.stores) ? data.stores : [];
            if (stores.length === 0) { document.getElementById('content').innerHTML = '<div class="empty">You do not have a business yet.</div>'; return; }
            stores.forEach(function (s) {
                const o = document.createElement('option');
                o.value = s.storeId;
                o.textContent = s.storeName + ' (' + s.storeId + ')';
                select.appendChild(o);
            });
            if (!stores.some(function (s) { return s.storeId === storeId; })) storeId = stores[0].storeId;
            select.value = storeId;
            select.addEventListener('change', function () {
                storeId = select.value; editing = null; note('', '');
                history.replaceState(null, '', '/tasks?storeId=' + encodeURIComponent(storeId));
                load();
            });
            load();
        } catch (e) {
            note('err', 'Could not load your businesses. ' + e.message);
        }
    })();
</script>
</body>
</html>
