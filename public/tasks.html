<!DOCTYPE html>
<html lang="en" data-app-shell="app">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <meta name="color-scheme" content="light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="opsAi">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icon-180.png">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-startup-image" href="/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="stylesheet" href="/app-shell.css?v=4">
    <script src="/app-shell.js?v=3"></script>
    <title>opsAi · Tasks &amp; alerts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #25D366; --primary-dark: #128C7E; --secondary: #075E54;
            --bg: #f5f7fa; --card: #fff; --text: #1a1a1a; --light: #666; --border: #e0e0e0;
            --ok: #10b981; --warn: #f59e0b; --bad: #ef4444;
        }
        html { -webkit-text-size-adjust: 100%; overflow-x: clip; overflow-y: auto; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; overflow-x: clip; overflow-y: auto; }
        header { background: #111; color: #fff; padding: 14px 20px; padding-top: max(14px, env(safe-area-inset-top)); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        header a { color: #fff; text-decoration: none; opacity: .85; font-size: 14px; }
        header .brand-logo { line-height: 0; opacity: 1; background: #fff; border-radius: 8px; padding: 4px 8px; }
        header .brand-logo img { display: block; height: 28px; width: auto; }
        header h1 { font-size: 18px; flex: 1; min-width: 8rem; }
        header select { padding: 8px 10px; border-radius: 6px; border: none; font-size: 16px; width: auto; min-width: 0; flex: 1; max-width: 100%; font-family: inherit; }
        main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 60px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab { padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 14px; }
        .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .card h2 { font-size: 16px; margin-bottom: 10px; }
        .muted { color: var(--light); font-size: 13px; }
        .scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .score { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
        .score .big { font-size: 28px; font-weight: 700; }
        .score .label { font-size: 12px; color: var(--light); text-transform: uppercase; letter-spacing: .04em; }
        .good { color: var(--ok); } .mid { color: var(--warn); } .low { color: var(--bad); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 12px; text-transform: uppercase; color: var(--light); padding: 8px; border-bottom: 1px solid var(--border); }
        td { padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: top; }
        tr:last-child td { border-bottom: none; }
        .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .b-open { background: #fef3c7; color: #92400e; } .b-late { background: #fee2e2; color: #991b1b; }
        .b-done { background: #d1fae5; color: #065f46; } .b-missed { background: #fee2e2; color: #991b1b; }
        .b-off { background: #e5e7eb; color: #374151; }
        button { cursor: pointer; font-size: 14px; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--border); background: #fff; font-family: inherit; }
        button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
        button.danger { color: var(--bad); }
        button.small { padding: 4px 10px; font-size: 12px; }
        button:disabled { opacity: .5; cursor: default; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
        label { display: block; font-size: 12px; color: var(--light); margin-bottom: 4px; }
        input[type=text], input[type=time], input[type=number], input[type=email], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; font-family: inherit; }
        textarea { min-height: 60px; resize: vertical; }
        .days label { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; color: var(--text); font-size: 14px; }
        .notice { padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 14px; }
        .notice.err { background: #fee2e2; color: #991b1b; } .notice.ok { background: #d1fae5; color: #065f46; } .notice.info { background: #e0f2fe; color: #075985; }
        .empty { text-align: center; padding: 28px 10px; color: var(--light); }
        .proof img { max-width: 240px; max-height: 200px; border-radius: 8px; border: 1px solid var(--border); display: block; margin-top: 6px; }
        .preset-group { margin-bottom: 12px; }
        .preset { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; font-size: 14px; }
        .preset input { margin-top: 3px; }
        .vendor-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .vendor-row input, .vendor-row select { flex: 1; }
        .pic-preset { display: inline-block; margin: 0 6px 6px 0; }
        .pic-field { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 6px; margin-bottom: 6px; align-items: center; }
        .pic-map { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 8px 0; font-size: 13px; }
        .pic-map .row { justify-content: space-between; }
        @media (max-width: 720px) { .pic-field { grid-template-columns: 1fr; } }
        html { scroll-behavior: smooth; }
        .admin-lead { font-size: 15px; color: var(--light); line-height: 1.5; margin-bottom: 20px; max-width: 36rem; }
        .admin-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; padding-bottom: 4px; }
        .admin-nav button {
            display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 10px;
            border: 1px solid transparent; background: transparent; color: var(--light); font-size: 14px; font-weight: 600;
        }
        .admin-nav button:hover { color: var(--text); background: #fff; border-color: var(--border); }
        .admin-nav button.active { background: #fff; color: var(--text); border-color: var(--border); }
        .admin-nav button span { background: #eef2f7; color: var(--light); border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 700; }
        .admin-panel { display: none; }
        .admin-panel.is-open { display: block; }
        .admin-kicker { font-size: 12px; letter-spacing: .04em; color: var(--light); font-weight: 600; margin-bottom: 8px; }
        .admin-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .admin-head h2 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -0.02em; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
        .admin-grid:has(> :only-child) { grid-template-columns: 1fr; }
        .admin-grid .card { margin-bottom: 0; }
        .card .card-help { margin-bottom: 14px; line-height: 1.45; max-width: 40rem; }
        .count { font-weight: 600; color: var(--light); font-size: 13px; }
        .preset-group { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
        .danger-card { border-color: #fecaca; }
        body.admin-page main { max-width: 880px; }
        .admin-view .card { padding: 22px 24px; box-shadow: none; border-color: #e8eaed; }
        .admin-view .card h2 { font-size: 16px; font-weight: 650; color: var(--text); margin-bottom: 6px; }
        .admin-view .count { background: var(--bg); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
        details.more { margin: 18px 0 0; }
        details.more summary { cursor: pointer; font-size: 14px; color: var(--light); margin-bottom: 12px; font-weight: 600; }
        .agent-rows { list-style: none; padding: 0; margin: 8px 0 0; }
        .agent-rows li {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 14px 0; border-top: 1px solid #eee;
        }
        .agent-rows li:first-child { border-top: none; }
        .agent-rows .agent-meta { min-width: 0; flex: 1; }
        .agent-rows .agent-name { font-weight: 650; font-size: 15px; }
        .agent-rows .agent-job { color: var(--light); font-size: 13px; margin-top: 2px; line-height: 1.35; }
        .agent-rows .agent-side { flex-shrink: 0; text-align: right; }
        .tool-setup-list { display: flex; flex-direction: column; gap: 12px; margin: 12px 0 8px; }
        .tool-setup {
            display: grid; grid-template-columns: 40px 1fr; gap: 12px 14px;
            padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: #fff;
        }
        .tool-setup img { width: 40px; height: 40px; border-radius: 9px; }
        .tool-setup .tool-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .tool-setup .tool-head strong { font-size: 14px; font-weight: 700; }
        .tool-setup .tool-status { font-size: 12px; font-weight: 650; color: var(--ok); }
        .tool-setup .tool-status.off { color: var(--light); }
        .tool-setup .tool-status.warn { color: #b45309; }
        .tool-setup .tool-blurb { font-size: 12px; color: var(--light); line-height: 1.35; margin: 2px 0 10px; }
        .tool-setup .tool-actions { grid-column: 2; }
        .agent-status { font-size: 12px; font-weight: 650; color: var(--ok); }
        .agent-status.off { color: var(--light); }
        .crew-cta { margin-top: 18px; padding-top: 16px; border-top: 1px solid #eee; }
        @media (max-width: 800px) { .admin-grid { grid-template-columns: 1fr; } }
        .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        @media (max-width: 640px) {
            td, th { padding: 8px 4px; }
            .hide-sm { display: none; }
            .vendor-row { flex-wrap: wrap; }
            .admin-nav button { font-size: 13px; padding: 8px 12px; }
            main { padding: 16px 12px 80px; }
            header { gap: 8px; }
            header h1 { font-size: 16px; }
            .tab { min-height: 44px; display: inline-flex; align-items: center; }
            button, button.small { min-height: 44px; }
            .agent-rows li { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div id="appSplash" aria-hidden="true"><img src="/icon-192.png" alt=""><span>opsAi</span></div>
<header>
    <a href="/dashboard" class="brand-logo" aria-label="Operation Intelligence"><img src="/logo.jpg" alt="Operation Intelligence"></a>
    <a href="/dashboard">&larr; Dashboard</a>
    <h1>Tasks &amp; alerts</h1>
    <select id="storeSelect" aria-label="Business"></select>
    <button type="button" class="small" id="logoutBtn">Log out</button>
</header>
<main>
    <div id="notice"></div>
    <div class="tabs">
        <div class="tab active" data-view="today">Due</div>
        <div class="tab" data-view="inspection">Inspection</div>
        <div class="tab" data-view="setup">Business admin</div>
    </div>
    <div id="content"><div class="empty">Loading…</div></div>
</main>

<script>
    // Keep in sync with TASK_CATEGORIES in lib/tasks/schedule.ts. The first eight are the 7Clean report's own.
    const CATEGORIES = {
        food_safety: 'Food Safety', proprietary_fresh: 'Proprietary Fresh Food', proprietary_beverage: 'Proprietary Beverage',
        product_availability: 'Product Availability', interior_cleanliness: 'Interior Cleanliness', exterior_cleanliness: 'Exterior Cleanliness',
        vault: 'Vault', back_of_house: 'Back of House', cleanliness: 'Cleanliness', inventory: 'Inventory', equipment: 'Equipment',
        customer_service: 'Customer service', safety: 'Safety', reports: 'Daily reports', bills: 'Bills / insurance', other: 'Other'
    };
    const SIMPLE_CATEGORIES = {
        bills: 'Bills / insurance', cleanliness: 'Cleanliness', inventory: 'Inventory', equipment: 'Equipment',
        customer_service: 'Customer service', safety: 'Safety', reports: 'Daily reports', other: 'Other'
    };
    const CRITICALITY = { critical: 'Critical (50)', major: 'Major (20)', minor: 'Minor (3)' };
    const CRIT_BADGE = { critical: '<span class="badge b-late">Critical</span>', major: '<span class="badge b-open">Major</span>', minor: '<span class="badge b-off">Minor</span>' };
    const EVIDENCE = { photo: 'Photo', text: 'Text answer', either: 'Photo or text', none: 'Just "done"' };
    const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    const pageParams = new URLSearchParams(location.search);
    let storeId = pageParams.get('storeId') || '';
    const startView = pageParams.get('view');
    let view = startView === 'setup' || startView === 'inspection' || startView === 'today' ? startView : 'today';
    const gmailFlash = pageParams.get('gmail');
    if (gmailFlash) {
        pageParams.delete('gmail');
        const clean = pageParams.toString();
        history.replaceState(null, '', '/tasks' + (clean ? '?' + clean : ''));
        if (gmailFlash === 'connected') setTimeout(function () { note('ok', 'Gmail connected (read-only).'); }, 0);
        else if (gmailFlash === 'denied') setTimeout(function () { note('err', 'Gmail connect was cancelled.'); }, 0);
        else if (gmailFlash === 'not_configured') setTimeout(function () { note('err', 'Gmail OAuth is not configured on this server.'); }, 0);
        else if (gmailFlash === 'owner_only') setTimeout(function () { note('err', 'Only the business owner can connect Gmail.'); }, 0);
        else if (gmailFlash === 'invalid' || gmailFlash === 'error') setTimeout(function () { note('err', 'Could not connect Gmail. Try again.'); }, 0);
    }
    let board = null;
    let inspection = null;
    let lastReport = null;
    let importing = null; // { pdf: base64, preview } while an inspector's report is being reviewed
    let editing = null; // template being edited, or {} for a new one
    const startPanel = pageParams.get('panel');
    let adminPanel = startPanel && String(startPanel).indexOf('admin-') === 0 ? startPanel : null; // one Business admin section at a time
    const features = {}; // store-type switches for the starter list, e.g. { fuel: true }

    if (window.opsai) {
        window.opsai.me().then(function (d) { if (!d) location.href = '/login'; });
    }
    const authHeaders = () => ({ 'Content-Type': 'application/json' });

    function esc(value) {
        return String(value === null || value === undefined ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function normTitle(value) {
        return String(value || '').trim().toLowerCase().replace(/['\u2019`]/g, "'").replace(/\s+/g, ' ');
    }
    function note(kind, text) {
        document.getElementById('notice').innerHTML = text ? '<div class="notice ' + kind + '">' + esc(text) + '</div>' : '';
        if (text) window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function clock(value) {
        if (!value) return '';
        return new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit', timeZone: board ? board.timeZone : undefined }).format(new Date(value));
    }
    function pctClass(p) { return p === null ? '' : p >= 90 ? 'good' : p >= 70 ? 'mid' : 'low'; }
    function pct(line) { return line.percent === null ? '—' : line.percent + '%'; }
    function unitText(unit) { return unit ? (/^[A-Za-z]{1,2}$/.test(unit) ? unit : ' ' + unit) : ''; }
    function limitText(t) {
        const hasMin = t.minValue !== null && t.minValue !== undefined, hasMax = t.maxValue !== null && t.maxValue !== undefined;
        if (hasMin && hasMax) return 'between ' + t.minValue + ' and ' + t.maxValue + unitText(t.unit);
        if (hasMax) return t.maxValue + unitText(t.unit) + ' or lower';
        if (hasMin) return t.minValue + unitText(t.unit) + ' or higher';
        return '';
    }
    function crit(c) { return c && CRIT_BADGE[c] ? CRIT_BADGE[c] : ''; }

    async function api(method, body, query) {
        const qs = new URLSearchParams(Object.assign({ storeId: storeId }, query || {})).toString();
        const res = await fetch('/api/stores/tasks?' + qs, { method: method, headers: authHeaders(), body: body ? JSON.stringify(body) : undefined });
        if (res.status === 401) { location.href = '/login'; return null; }
        let data = {};
        try { data = await res.json(); } catch (e) { /* not json */ }
        if (!res.ok) throw new Error(data.error || ('The server answered ' + res.status));
        return data;
    }

    async function load() {
        if (!storeId) return;
        document.getElementById('content').innerHTML = '<div class="empty">Loading…</div>';
        try {
            board = await api('GET');
            Object.keys(features).forEach(function (k) { delete features[k]; });
            if (board.setup) {
                (board.setup.features || []).forEach(function (id) { features[id] = true; });
                if (board.setup.fuel) features.fuel = true;
                const t = board.setup.storeType;
                if (t === 'seven_eleven' || t === 'convenience' || t === 'gas_station') {
                    features.cooler = true;
                    features.shelves = true;
                    features.restroom = true;
                    features.till = true;
                } else if (t === 'office' || t === 'real_estate' || t === 'personal') {
                    // Desk businesses never get shop-floor feature flags.
                    delete features.cooler;
                    delete features.shelves;
                    delete features.restroom;
                    delete features.till;
                }
            }
            render();
        } catch (e) {
            document.getElementById('content').innerHTML = '';
            note('err', 'Could not load tasks. ' + e.message + ' If this is new, the task tables may not be created yet (run scripts/add-tasks.sql).');
        }
    }

    /* ------------------------------------ Today ------------------------------------ */

    function statusBadge(run) {
        if (run.status === 'DONE') return '<span class="badge b-done">Done</span>';
        if (run.status === 'MISSED') return '<span class="badge b-missed">Missed</span>';
        if (run.status === 'CANCELLED') return '<span class="badge b-off">Removed</span>';
        const lateMs = Date.now() - new Date(run.dueAt).getTime();
        return lateMs > (run.lateAfterMinutes || 60) * 60000 ? '<span class="badge b-late">Late</span>' : '<span class="badge b-open">Open</span>';
    }

    function scoreCard(label, line) {
        return '<div class="score"><div class="label">' + esc(label) + '</div><div class="big ' + pctClass(line.percent) + '">' + esc(pct(line)) + '</div>' +
            '<div class="muted">' + esc(line.done) + ' done · ' + esc(line.missed) + ' missed · ' + esc(line.pending) + ' pending</div>' +
            (line.criticalMissed ? '<div class="muted low">' + esc(line.criticalMissed) + ' Critical missed</div>' : '') + '</div>';
    }

    function renderToday() {
        const t = board.scoreToday;
        let html = '<div class="scores">' +
            scoreCard('Due score', t.total) +
            '<div class="score"><div class="label">Business day</div><div class="big" style="font-size:18px;font-weight:650;">' +
            esc(board.today || '') + '</div><div class="muted" style="margin-top:6px;">' + esc(board.timeZone) + '</div></div></div>';

        if (!board.setup && board.templates.length === 0) html = setupCard() + html;
        const runs = board.runs.filter(function (r) { return r.status !== 'CANCELLED'; });
        const open = runs.filter(function (r) { return r.status === 'OPEN'; })
            .sort(function (a, b) { return new Date(a.dueAt) - new Date(b.dueAt); });
        const closed = runs.filter(function (r) { return r.status !== 'OPEN'; })
            .filter(function (r) { return r.localDate === board.today || (r.completedAt && String(r.completedAt).slice(0, 10) === board.today); })
            .reverse();

        const photoBadge = function (r) {
            const note = r.photoNote ? '<div class="muted">' + esc(r.photoNote) + '</div>' : '';
            if (r.photoVerdict === 'pass') return ' <span class="badge b-off">Photo OK</span>' + note;
            if (r.photoVerdict === 'fail') return ' <span class="badge b-late">Photo failed</span>' + note;
            if (r.photoVerdict === 'unclear') return ' <span class="badge b-open">Photo unclear</span>' + note;
            if (r.photoVerdict === 'unchecked') return ' <span class="badge b-off">Photo pending</span>' + note;
            if (r.photoVerdict === 'approved') return ' <span class="badge b-off">Photo accepted</span>';
            return '';
        };
        const proof = function (r) {
            if (r.status === 'OPEN' && r.hasPhoto) {
                return '<div class="proof"><button class="small" data-photo="' + esc(r.id) + '">View photo</button><div data-photo-box="' + esc(r.id) + '"></div></div>';
            }
            if (r.status !== 'DONE') return '<span class="muted">—</span>';
            let p = '<div class="proof">';
            if (r.resultValue !== null && r.resultValue !== undefined) p += '<div><strong>' + esc(r.resultValue) + esc(unitText(r.unit)) + '</strong></div>';
            else if (r.evidenceText) p += '<div>' + esc(r.evidenceText) + '</div>';
            if (r.hasPhoto) p += '<button class="small" data-photo="' + esc(r.id) + '">View photo</button><div data-photo-box="' + esc(r.id) + '"></div>';
            if (!r.evidenceText && !r.hasPhoto) p += '<span class="muted">Done</span>';
            return p + '<div class="muted">' + esc(clock(r.completedAt)) + '</div></div>';
        };
        const rows = function (list) {
            return list.map(function (r) {
                return '<tr><td>' + esc(r.title) + ' ' + crit(r.criticality) +
                    '<div class="muted">' + esc(CATEGORIES[r.category] || r.category) +
                    (r.issueText ? ' · ' + esc(r.issueText) : '') + '</div></td>' +
                    '<td>' + esc(clock(r.dueAt)) + '</td><td>' + statusBadge(r) +
                    (r.outcome === 'fail' && r.status === 'OPEN' ? ' <span class="badge b-late">Out of range</span>' : '') +
                    (r.outcome === 'problem' && r.status === 'OPEN' ? ' <span class="badge b-late">Problem</span>' : '') +
                    photoBadge(r) +
                    (r.escalated ? ' <span class="muted">escalated</span>' : '') + '</td><td class="proof">' + proof(r) + '</td>' +
                    (board.canEdit && (r.status === 'OPEN' || r.status === 'MISSED')
                        ? '<td>' + (r.status === 'OPEN' && r.hasPhoto && (r.photoVerdict === 'fail' || r.photoVerdict === 'unclear')
                            ? '<button class="small" data-approve="' + esc(r.id) + '">Accept</button> '
                            : '') +
                          '<button class="small danger" data-close="' + esc(r.id) + '">Remove</button></td>'
                        : '<td></td>') + '</tr>';
            }).join('');
        };
        const head = '<thead><tr><th>Task</th><th>Due</th><th>Status</th><th>Proof</th><th></th></tr></thead>';

        const alertsOn = !(board.channels && board.channels.taskAlerts && board.channels.taskAlerts.enabled === false);
        html += '<div class="card"><div class="row" style="justify-content: space-between; gap:10px; flex-wrap:wrap;"><div>' +
            '<h2 style="margin:0;">Needs action' + (open.length ? ' · ' + open.length : '') + '</h2>' +
            '<p class="muted" style="margin:6px 0 0;">' +
            (alertsOn
                ? 'Staff get due/remind messages. Admins get a brief daily summary (daily tasks) and weekly summary (weekly tasks) after 8pm store time. Tap <strong>Send alerts</strong> locally after a due time.'
                : 'WhatsApp alerts are <strong>off</strong> for this business. Due times still track here; nothing is sent until you turn them on.') +
            '</p></div>' +
            (board.canEdit
                ? '<div class="row" style="gap:10px;align-items:center;">' +
                  '<label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;white-space:nowrap;">' +
                  '<input type="checkbox" data-task-alerts' + (alertsOn ? ' checked' : '') + '> WhatsApp alerts</label>' +
                  '<button data-run-now class="primary"' + (alertsOn ? '' : ' disabled title="Turn on WhatsApp alerts first"') + '>Send alerts</button></div>'
                : '') + '</div>' +
            (open.length
                ? '<table style="margin-top:12px;">' + head + '<tbody>' + rows(open) + '</tbody></table>'
                : '<div class="empty">Nothing due right now. If you just set Lock up for a past time, turn on alerts and tap Send alerts.</div>') + '</div>';

        const upcoming = (board.templates || []).filter(function (t) {
            if (!t.active) return false;
            return !(board.runs || []).some(function (r) {
                return r.title === t.title && r.status === 'OPEN';
            });
        });
        if (upcoming.length && !open.length) {
            html += '<div class="card"><h2>Scheduled today</h2><p class="muted" style="margin-bottom:10px;">These are on the business. They appear above after Send alerts (or the cron) runs past their due time.</p><ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.6;">';
            upcoming.slice(0, 12).forEach(function (t) {
                html += '<li><strong>' + esc(t.title) + '</strong> · ' + esc(t.scheduleText || '') + '</li>';
            });
            html += '</ul></div>';
        }

        if (closed.length) {
            html += '<div class="card"><h2>Done today · ' + closed.length + '</h2>' +
                '<table>' + head + '<tbody>' + rows(closed) + '</tbody></table></div>';
        }
        return html;
    }

    /* ---------------------------------- Inspection ---------------------------------- */

    async function loadInspection() {
        document.getElementById('content').innerHTML = '<div class="empty">Loading…</div>';
        try {
            const data = await api('GET', null, { view: 'inspection' });
            inspection = data.prediction;
            lastReport = data.lastReport || null;
            if (!board) board = {};
            board.canEdit = data.canEdit;
            board.storeName = data.storeName || board.storeName;
            board.timeZone = data.timeZone || board.timeZone || 'America/New_York';
            board.templates = Array.isArray(data.templates) ? data.templates : (board.templates || []);
            board.inspectionPresets = Array.isArray(data.presets) ? data.presets : [];
            render();
        } catch (e) {
            document.getElementById('content').innerHTML = '';
            note('err', 'Could not load the inspection view. ' + e.message);
        }
    }

    function templateForStandard(standardId) {
        if (!board || !board.templates || !standardId) return null;
        return board.templates.find(function (t) { return t.standardId === standardId; }) || null;
    }

    function presetForId(presetId) {
        if (!board || !board.inspectionPresets || !presetId) return null;
        return board.inspectionPresets.find(function (p) { return p.presetId === presetId; }) || null;
    }

    function scheduleLine(t) {
        if (!t) return '';
        const bits = [];
        if (t.shift) bits.push(t.shift);
        if (t.startTime) bits.push(t.startTime);
        if (t.evidence && EVIDENCE[t.evidence]) bits.push(EVIDENCE[t.evidence]);
        if (t.points != null) bits.push(t.points + ' pt');
        return bits.length ? '<div class="muted">' + esc(bits.join(' · ')) + '</div>' : '';
    }

    const MAX_REPORT_BYTES = 2500000;

    function reportHeader(r) {
        return esc(r.property || 'Inspection') + ' · ' + esc(String(r.inspectedOn || '').slice(0, 10)) +
            (r.cycle ? ' · cycle ' + esc(r.cycle) : '') + (r.visit ? ', visit ' + esc(r.visit) : '');
    }

    function renderLastReport() {
        if (!lastReport) return '';
        const failed = Array.isArray(lastReport.findings) ? lastReport.findings : [];
        return '<div class="card"><h2>Last inspector report: <span class="' + pctClass(lastReport.percent) + '">' + esc(lastReport.percent) + '%</span></h2>' +
            '<div class="muted" style="margin-bottom: 8px;">' + reportHeader(lastReport) + '</div>' +
            (failed.length ? '<div class="muted">The inspector found: ' + failed.map(function (f) { return '<strong>' + esc(f.standardId) + '</strong>' + (f.repeat ? ' (repeat)' : ''); }).join(', ') + '. These are marked below.</div>' : '') + '</div>';
    }

    function renderImport() {
        if (!board || !board.canEdit) return '';
        if (!importing) {
            return '<div class="card"><h2>Import the inspector\'s report</h2>' +
                '<p class="muted" style="margin-bottom: 10px;">Upload the 7Clean Debrief Report PDF you got after an inspection. opsAi reads what failed and offers a task for each one, with the inspector\'s note on it. It reads the file with fixed rules (no AI, no cost). The manager\'s name, email and signature are not read or kept, and the PDF itself is not stored.</p>' +
                '<input type="file" id="reportFile" accept="application/pdf"></div>';
        }
        const pv = importing.preview;
        const rows = pv.proposals.map(function (p) {
            const pick = p.kind === 'add' || p.kind === 'custom'
                ? '<input type="checkbox" data-report-pick="' + esc(p.standardId) + '" checked>'
                : '';
            const label = { add: 'Add', custom: 'Add (from the report)', tracked: 'Already tracked', skip: 'Skipped' }[p.kind] || '';
            return '<tr><td>' + pick + '</td><td><strong>' + esc(p.standardId) + '</strong></td><td>' + esc(p.title) + ' ' + crit(p.criticality) + (p.repeat ? ' <span class="badge b-late">Repeat</span>' : '') +
                (p.comment ? '<div class="muted">Inspector: ' + esc(p.comment) + '</div>' : (p.details.length ? '<div class="muted">Inspector: ' + esc(p.details[0]) + '</div>' : '')) +
                (p.note ? '<div class="muted">' + esc(p.note) + '</div>' : '') + '</td><td>' + (p.points === null ? '' : esc(p.points) + ' pt') + '</td><td>' + esc(label) +
                (p.scheduleText ? '<div class="muted">' + esc(p.scheduleText) + '</div>' : '') + '</td></tr>';
        }).join('');
        return '<div class="card"><h2>Inspector report: ' + esc(pv.report.percent) + '%</h2>' +
            '<div class="muted" style="margin-bottom: 8px;">' + reportHeader(pv.report) + (pv.report.earned !== null ? ' · ' + esc(pv.report.earned) + ' of ' + esc(pv.report.possible) + ' points' : '') + '</div>' +
            (pv.alreadySaved ? '<div class="notice info">This report was imported before. Adding tasks again only adds the ones you tick that are not tracked yet.</div>' : '') +
            (pv.proposals.length ? '<table><tbody>' + rows + '</tbody></table>' : '<div class="empty">The report lists no failed standards. 👍</div>') +
            '<div style="margin-top: 12px;"><button class="primary" data-apply-report="1">Add ticked tasks and save the report</button> <button class="small" data-cancel-report="1">Cancel</button></div>' +
            '<p class="muted" style="margin-top: 8px;">New tasks start at a default time. Set their times in Setup.</p></div>';
    }

    function readFileAsBase64(file) {
        return new Promise(function (resolve, reject) {
            const reader = new FileReader();
            reader.onload = function () { resolve(String(reader.result).split(',')[1] || ''); };
            reader.onerror = function () { reject(new Error('Could not read that file.')); };
            reader.readAsDataURL(file);
        });
    }

    async function previewReport(file) {
        if (file.size > MAX_REPORT_BYTES) { note('err', 'That file is over 2.5 MB. Is it the right PDF?'); return; }
        note('info', 'Reading the report…');
        try {
            const pdf = await readFileAsBase64(file);
            const preview = await api('POST', { action: 'preview_report', pdf: pdf });
            importing = { pdf: pdf, preview: preview };
            note('', '');
            render();
        } catch (e) {
            note('err', e.message);
        }
    }

    function renderInspection() {
        const p = inspection;
        if (!p) return '<div class="empty">Loading…</div>';
        let html = '';
        if (editing && board && board.canEdit) html += renderForm();
        html += renderImport() + renderLastReport();
        if (p.autoFail.length) {
            html += '<div class="notice err"><strong>Auto-fail risk.</strong> ' + p.autoFail.map(function (r) { return esc(r.standardId) + ' ' + esc(r.title); }).join('; ') + '. An inspection can fail outright on these.</div>';
        }
        html += '<div class="scores"><div class="score"><div class="label">If the inspector walked in now</div><div class="big ' + pctClass(p.percent) + '">' + (p.percent === null ? '—' : esc(p.percent) + '%') + '</div>' +
            '<div class="muted">' + esc(p.earned) + ' of ' + esc(p.possible) + ' points on the standards you track</div></div>' +
            '<div class="score"><div class="label">Would lose right now</div><div class="big ' + (p.atRisk ? 'low' : 'good') + '">' + esc(p.atRisk) + '</div><div class="muted">points</div></div>' +
            '<div class="score"><div class="label">Not tracked yet</div><div class="big ' + (p.untracked ? 'mid' : 'good') + '">' + esc(p.untracked) + '</div><div class="muted">points an inspector would still check</div></div>' +
            p.byCategory.map(function (c) { return '<div class="score"><div class="label">' + esc(c.label) + '</div><div class="big ' + pctClass(c.percent) + '">' + (c.percent === null ? '—' : esc(c.percent) + '%') + '</div><div class="muted">' + esc(c.earned) + ' / ' + esc(c.possible) + ' pts</div></div>'; }).join('') + '</div>';

        const row = function (r, extra) {
            const t = templateForStandard(r.standardId);
            const edit = board && board.canEdit && t
                ? '<button class="small" data-edit-standard="' + esc(t.id) + '">Edit</button>'
                : '';
            return '<tr><td><strong>' + esc(r.standardId) + '</strong></td><td>' + esc(r.title) + ' ' + crit(r.criticality) + (r.repeat ? ' <span class="badge b-late">Repeat</span>' : '') + (r.lastFinding && !r.repeat ? ' <span class="badge b-late">Found at last inspection</span>' : '') +
                '<div class="muted">' + esc(CATEGORIES[r.category] || r.category) + '</div>' + scheduleLine(t) + '</td><td>' + esc(r.points) + ' pt</td><td>' +
                (extra || '') + (edit ? (extra ? ' ' : '') + edit : '') + '</td></tr>';
        };
        html += '<div class="card"><h2>Would cost points right now (' + p.fails.length + ')</h2>' +
            (p.fails.length ? '<table><tbody>' + p.fails.map(function (r) { return row(r, '<span class="low">' + esc(r.reason) + '</span>'); }).join('') + '</tbody></table>' : '<div class="empty">Nothing is failing on the standards you track. 👍</div>') + '</div>';
        if (p.pending.length) {
            html += '<div class="card"><h2>Waiting for proof (' + p.pending.length + ')</h2><table><tbody>' + p.pending.map(function (r) { return row(r, '<span class="muted">not due or not answered yet</span>'); }).join('') + '</tbody></table></div>';
        }
        if (p.notTracked.length) {
            html += '<div class="card"><h2>Not tracked yet (' + p.notTracked.length + ')</h2><p class="muted" style="margin-bottom: 8px;">An inspector checks these, but nobody is being asked about them here. Add one and set shift, time, proof, and points.</p><table><tbody>' +
                p.notTracked.map(function (r) {
                    return '<tr><td><strong>' + esc(r.standardId) + '</strong></td><td>' + esc(r.title) + ' ' + crit(r.criticality) +
                        '<div class="muted">' + esc(CATEGORIES[r.category] || r.category) + '</div></td><td>' + esc(r.points) + ' pt</td><td>' +
                        (board && board.canEdit ? '<button class="small" data-add-standard="' + esc(r.presetId) + '">Add task</button>' : '') + '</td></tr>';
                }).join('') + '</tbody></table></div>';
        }
        html += '<div class="card"><h2>Passing (' + p.passes.length + ')</h2>' +
            (p.passes.length
                ? '<table><tbody>' + p.passes.map(function (r) { return row(r, '<span class="muted">ok</span>'); }).join('') + '</tbody></table>'
                : '<div class="muted">None yet.</div>') + '</div>';
        html += '<p class="muted">This is a prediction from what your team has proven through tasks, not the inspector\'s score. It covers only the standards in the list (what the 7Clean report we have shows), so the real inspection can include items not shown here. A standard passes when its latest task was done with proof, and fails when it was missed, is late, read out of range, or has a problem reported.</p>';
        return html;
    }

    /* ------------------------------------ Setup ------------------------------------ */

    function categoryMap() {
        if (isSevenEleven()) return CATEGORIES;
        const map = Object.assign({}, SIMPLE_CATEGORIES);
        if (editing && editing.category && !map[editing.category] && CATEGORIES[editing.category]) {
            map[editing.category] = CATEGORIES[editing.category];
        }
        return map;
    }

    function howOftenOf(t) {
        if (t.frequency === 'monthly') return 'monthly';
        if (t.frequency === 'interval') return 'interval';
        if (t.frequency === 'once') return 'once';
        const days = t.daysOfWeek || [0, 1, 2, 3, 4, 5, 6];
        if (!t.id || days.length === 7) return 'daily';
        return 'weekly';
    }

    function shiftSelect(current) {
        const fromSetup = (board && board.setup && board.setup.shifts) ? board.setup.shifts.map(function (s) { return s.name; }) : [];
        const extras = ['Morning', 'Afternoon', 'Evening', 'Night', 'Every shift', 'End of shift'];
        const names = [];
        fromSetup.concat(extras).forEach(function (n) { if (n && names.indexOf(n) < 0) names.push(n); });
        if (current && names.indexOf(current) < 0) names.unshift(current);
        return '<select name="shift"><option value="">Any shift</option>' + names.map(function (n) {
            return '<option value="' + esc(n) + '"' + (n === current ? ' selected' : '') + '>' + esc(n) + '</option>';
        }).join('') + '</select>';
    }

    /** HH:MM end time later than start (same day). Prefer +8h, at least +1h, never past 23:59. */
    function defaultEndAfterStart(startHHMM) {
        const m = /^(\d{1,2}):(\d{2})$/.exec(String(startHHMM || '').trim());
        let startMin = m ? Number(m[1]) * 60 + Number(m[2]) : 10 * 60;
        if (startMin < 0) startMin = 0;
        let endMin = Math.min(startMin + 8 * 60, 23 * 60 + 59);
        if (endMin <= startMin) endMin = Math.min(startMin + 60, 23 * 60 + 59);
        if (endMin <= startMin) return '';
        const hh = String(Math.floor(endMin / 60)).padStart(2, '0');
        const mm = String(endMin % 60).padStart(2, '0');
        return hh + ':' + mm;
    }

    function renderForm() {
        const t = editing;
        const val = function (k, d) { return t[k] === null || t[k] === undefined ? d : t[k]; };
        const days = t.daysOfWeek || [0, 1, 2, 3, 4, 5, 6];
        const repeats = Boolean(t.repeatEveryMinutes);
        const startTime = val('startTime', '10:00');
        const endTime = val('endTime', '') || (repeats ? defaultEndAfterStart(startTime) : '');
        const how = howOftenOf(t);
        const monthDay = (t.monthDays && t.monthDays[0]) || 1;
        const monthOpts = [];
        for (let d = 1; d <= 28; d += 1) monthOpts.push('<option value="' + d + '"' + (d === monthDay ? ' selected' : '') + '>' + d + '</option>');
        monthOpts.push('<option value="31"' + (monthDay === 31 ? ' selected' : '') + '>Last day of the month</option>');
        const options = function (map, current) {
            return Object.keys(map).map(function (k) { return '<option value="' + esc(k) + '"' + (k === current ? ' selected' : '') + '>' + esc(map[k]) + '</option>'; }).join('');
        };
        const howOpts = [
            ['daily', 'Every day'],
            ['weekly', 'Weekly'],
            ['monthly', 'Monthly']
        ];
        if (how === 'interval') howOpts.push(['interval', 'Every few days']);
        if (how === 'once') howOpts.push(['once', 'Once, on one date']);
        const sevenClean = isSevenEleven() || Boolean(t.standardId);
        return '<div class="card" id="formCard"><h2>' + (t.id ? 'Edit reminder' : (t.standardId ? 'Add ' + esc(t.standardId) + ' task' : 'New reminder')) + '</h2>' +
            '<p class="muted card-help">' + (sevenClean
                ? 'Set shift, time, proof, and points. Save to start tracking this standard.'
                : 'Name it, pick a category, the shift, the time, and how often. That is enough.') + '</p><form id="taskForm">' +
            '<div class="grid">' +
            '<div style="grid-column: 1 / -1;"><label>What is the task?</label><input type="text" name="title" maxlength="120" required value="' + esc(val('title', '')) + '" placeholder="e.g. Pay the electric bill"></div>' +
            '<div><label>Category</label><select name="category">' + options(categoryMap(), val('category', 'other')) + '</select></div>' +
            '<div><label>Shift</label>' + shiftSelect(val('shift', '')) + '</div>' +
            '<div><label>Time of the reminder (store time)</label><input type="time" name="startTime" required value="' + esc(startTime) + '"></div>' +
            '<div><label>How often</label><select name="howOften">' + howOpts.map(function (o) {
                return '<option value="' + o[0] + '"' + (how === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
            }).join('') + '</select></div>' +
            '<div><label>Proof</label><select name="evidence">' + options(EVIDENCE, val('evidence', t.id ? 'either' : (sevenClean ? 'photo' : 'text'))) + '</select></div>' +
            (sevenClean
                ? '<div><label>Points</label><input type="number" name="points" min="0" max="100" value="' + esc(val('points', '')) + '"></div>' +
                  '<div><label>Standard ID</label><input type="text" name="standardId" maxlength="20" value="' + esc(val('standardId', '')) + '"></div>' +
                  '<div><label>How serious is a miss?</label><select name="criticality"><option value="">Not set</option>' + options(CRITICALITY, val('criticality', '')) + '</select></div>'
                : '') +
            '</div>' +
            '<div class="days" id="weeklyBox" style="margin: 14px 0;' + (how === 'weekly' ? '' : ' display:none;') + '"><label>Which days</label>' + DAYS.map(function (d, i) {
                return '<label><input type="checkbox" name="day" value="' + i + '"' + (days.indexOf(i) >= 0 ? ' checked' : '') + '> ' + d + '</label>';
            }).join('') + '</div>' +
            '<div id="monthlyBox" style="margin: 14px 0;' + (how === 'monthly' ? '' : ' display:none;') + '"><label>Day of the month</label><select name="monthDay">' + monthOpts.join('') + '</select></div>' +
            '<div class="grid" id="intervalBox" style="margin: 14px 0;' + (how === 'interval' ? '' : ' display:none;') + '">' +
            '<div><label>Every how many days (2 to 90; 14 = every 2 weeks)</label><input type="number" name="intervalDays" min="2" max="90" value="' + esc(val('intervalDays', 3)) + '"></div>' +
            '<div><label>First time on (optional, default today)</label><input type="date" name="anchorDate" value="' + esc(how === 'interval' ? val('anchorDate', '') : '') + '"></div></div>' +
            '<div class="grid" id="onceBox" style="margin: 14px 0;' + (how === 'once' ? '' : ' display:none;') + '">' +
            '<div><label>On this date</label><input type="date" name="onceDate" value="' + esc(how === 'once' ? val('anchorDate', '') : '') + '"></div></div>' +
            '<div style="margin-top: 14px;"><label>Note in the alert (optional)</label><textarea name="instructions" maxlength="500" placeholder="What good looks like, or what to reply">' + esc(val('instructions', '')) + '</textarea></div>' +
            '<details class="more"><summary>More options</summary>' +
            '<div style="margin: 14px 0;"><label>Have AI check the photo (optional)</label><input type="text" name="photoCheck" maxlength="200" value="' + esc(val('photoCheck', '')) + '" placeholder="What the photo must show"></div>' +
            '<div style="margin: 14px 0;"><label>Limit on a number answer (optional)</label>' +
            '<div class="grid"><div><label>At least</label><input type="number" step="any" name="minValue" value="' + esc(val('minValue', '')) + '"></div>' +
            '<div><label>At most</label><input type="number" step="any" name="maxValue" value="' + esc(val('maxValue', '')) + '"></div>' +
            '<div><label>Unit (F, rows, items)</label><input type="text" name="unit" maxlength="10" value="' + esc(val('unit', '')) + '"></div></div></div>' +
            '<div style="margin: 14px 0;"><label>If something is broken, what should they do meanwhile? (optional)</label><textarea name="fallback" maxlength="300" placeholder="e.g. Label printer broken? Write the date on tape.">' + esc(val('fallback', '')) + '</textarea></div>' +
            '<div style="margin: 14px 0;"><label><input type="checkbox" name="repeats"' + (repeats ? ' checked' : '') + '> Repeat during the day (for example every hour)</label>' +
            '<div class="grid" id="repeatBox" style="margin-top: 8px;' + (repeats ? '' : ' display:none;') + '">' +
            '<div><label>Every (minutes)</label><input type="number" name="repeatEveryMinutes" min="5" max="720" value="' + esc(val('repeatEveryMinutes', 60)) + '"' + (repeats ? ' required' : '') + '></div>' +
            '<div><label>Until (same day, after start)</label><input type="time" name="endTime" value="' + esc(endTime) + '"' + (repeats ? ' required' : '') + '></div>' +
            '<p class="muted" style="grid-column:1/-1;margin:0;">Repeats need a later end time on the same day (e.g. start 7:00, until 15:00).</p></div></div>' +
            '<div class="grid">' +
            '<div><label>Remind every (minutes)</label><input type="number" name="remindEveryMinutes" min="5" max="240" value="' + esc(val('remindEveryMinutes', 15)) + '"></div>' +
            '<div><label>Tell the owner after (minutes)</label><input type="number" name="escalateAfterMinutes" min="10" max="1440" value="' + esc(val('escalateAfterMinutes', 60)) + '"></div>' +
            '<div><label>Counts as late after (minutes)</label><input type="number" name="lateAfterMinutes" min="5" max="720" value="' + esc(val('lateAfterMinutes', 60)) + '"></div>' +
            '</div></details>' +
            '<div style="margin-top: 14px;"><label><input type="checkbox" name="active"' + (val('active', true) ? ' checked' : '') + '> Active</label></div>' +
            '<div class="row" style="margin-top: 14px;"><button type="submit" class="primary">Save reminder</button><button type="button" data-cancel-edit>Cancel</button></div>' +

        const list = board.picturePurposes || [];

    function picSummary(t) {
        const takes = (t.fields || []).filter(function (f) { return f.purpose !== 'ignore'; })
            .map(function (f) { return f.label + ' → ' + purposeLabel(f.purpose); });
        const ignores = (t.fields || []).filter(function (f) { return f.purpose === 'ignore'; }).map(function (f) { return f.label; });
        const parts = takes.slice();
        if (ignores.length) parts.push('ignore ' + ignores.join(', '));
        if (t.note) parts.push(t.note);
        return parts.join(' · ');
    }

    function purposesForKind(kind) {
        const all = board.picturePurposes || [
            { id: 'fuel', label: 'Fuel / gas', kinds: ['daily_close'] },
            { id: 'store_credit', label: 'Inside card (store credit)', kinds: ['daily_close'] },
            { id: 'cash', label: 'Inside cash (till / acceptor)', kinds: ['daily_close'] },
            { id: 'payout', label: 'Comes off cash (named paid-out)', kinds: ['daily_close'] },
            { id: 'ignore', label: 'Ignore this line', kinds: ['daily_close', 'invoice', 'work_schedule'] },
        ];
        return all.filter(function (p) {
            if (!p.kinds || !p.kinds.length) return true;
            return p.kinds.indexOf(kind) >= 0;
        });
    }

    function purposeSelect(selected) {
        const options = purposesForKind(currentPicKind());
        const value = options.some(function (p) { return p.id === selected; }) ? selected : (options[0] ? options[0].id : 'ignore');

    async function proposePictureMapFromFile(file, kind) {
        if (!file) return;
        if (file.size > MAX_REPORT_BYTES) { setPicMapStatus('Photo must be under 2.5 MB.'); return; }
        if (!/^image\/(jpeg|png|webp|gif)$/i.test(file.type)) { setPicMapStatus('Use a JPEG, PNG, or WebP photo.'); return; }
        setPicMapStatus('Reading the lines on this page…');
        try {
            const image = await readFileAsBase64(file);
            const data = await api('POST', { action: 'propose_picture_template', kind: kind || currentPicKind(), image: image, mime: file.type });
            fillPictureMap(data.template);
            setPicMapStatus('Check each line. Change anything that is wrong, then save the map.');
        } catch (err) {
            setPicMapStatus(err.message + ' Pick a starter, or type the lines yourself.');
        }
    }

    function shiftOrder(keys) {
        const order = ['Morning', 'Every shift', 'Evening', 'Night', 'End of shift', 'Weekly', 'Monthly', 'No shift label'];
        return keys.slice().sort(function (a, b) {
            const ia = order.indexOf(a), ib = order.indexOf(b);
            if (ia < 0 && ib < 0) return a.localeCompare(b);
            if (ia < 0) return 1;
            if (ib < 0) return -1;
            return ia - ib;
        });
    }

    function readForm(form) {
        const f = new FormData(form);
        const num = function (k) { const v = f.get(k); return v === null || v === '' ? null : Number(v); };
        const repeats = f.get('repeats') === 'on';
        let endTime = repeats ? (f.get('endTime') || null) : null;
        const startTime = f.get('startTime');
        if (repeats) {
            const startM = startTime ? Number(String(startTime).slice(0, 2)) * 60 + Number(String(startTime).slice(3, 5)) : null;
            const endM = endTime ? Number(String(endTime).slice(0, 2)) * 60 + Number(String(endTime).slice(3, 5)) : null;
            if (endM === null || startM === null || endM <= startM) endTime = defaultEndAfterStart(startTime);
        }
        const how = f.get('howOften') || 'daily';
        let frequency = 'weekly';
        let daysOfWeek;
        let monthDays = [];
        let intervalDays = null;
        let anchorDate = null;
        if (how === 'daily') {
            frequency = 'weekly';
            daysOfWeek = [0, 1, 2, 3, 4, 5, 6];
        } else if (how === 'weekly') {
            frequency = 'weekly';
            daysOfWeek = f.getAll('day').map(Number);
        } else if (how === 'monthly') {
            frequency = 'monthly';
            const day = num('monthDay');
            monthDays = day ? [day] : [1];
        } else if (how === 'interval') {
            frequency = 'interval';
            intervalDays = num('intervalDays');
            anchorDate = f.get('anchorDate') || null;
        } else if (how === 'once') {
            frequency = 'once';
            anchorDate = f.get('onceDate') || null;
        }
        return {
            title: f.get('title'),
            instructions: f.get('instructions') || null,
            category: f.get('category'),
            standardId: f.get('standardId') || null,
            criticality: f.get('criticality') || null,
            minValue: num('minValue'),
            maxValue: num('maxValue'),
            unit: f.get('unit') || null,
            fallback: f.get('fallback') || null,
            shift: f.get('shift') || null,
            startTime: startTime,
            endTime: endTime,
            repeatEveryMinutes: repeats ? num('repeatEveryMinutes') : null,
            frequency: frequency,
            daysOfWeek: daysOfWeek,
            intervalDays: intervalDays,
            anchorDate: anchorDate,
            monthDays: monthDays,
            evidence: f.get('evidence'),
            photoCheck: f.get('photoCheck') || null,
            points: num('points') === null ? undefined : num('points'),
            remindEveryMinutes: num('remindEveryMinutes') || 15,
            escalateAfterMinutes: num('escalateAfterMinutes'),
            lateAfterMinutes: num('lateAfterMinutes') || 60,
            active: f.get('active') === 'on'
        };
    }

    async function act(body, success) {
        note('', '');
        try {
            const r = await api('POST', body);
            if (success) note('ok', typeof success === 'function' ? success(r) : success);
            return r;
        } catch (e) {
            note('err', e.message);
            return null;
        }
    }

        if (!ok) el.checked = !on;
        el.disabled = false;
