<!DOCTYPE html>
<html lang="en" data-app-shell="app">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="opsAi">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icon-180.png">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="stylesheet" href="/app-shell.css?v=6">
    <link rel="stylesheet" href="/app-ui.css?v=2">
    <script src="/app-shell.js?v=6"></script>
    <title>opsAi · More</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg); color: var(--text); min-height: 100dvh; font-size: var(--font-size);
        }
        header {
            background: #111; color: #fff; padding: 14px 16px;
            padding-top: max(14px, env(safe-area-inset-top));
            display: flex; gap: 10px; align-items: center;
        }
        header .brand-logo { background: #fff; border-radius: 8px; padding: 4px 8px; line-height: 0; }
        header .brand-logo img { display: block; height: 28px; width: auto; }
        header h1 { font-size: 17px; font-weight: 650; flex: 1; }
        header select {
            flex: 1; max-width: 55%; padding: 8px 10px; border-radius: 8px; border: none;
            font-size: 15px; font-family: inherit;
        }
        main { max-width: 480px; margin: 0 auto; padding: 16px 16px 24px; }
        .lead { color: var(--text-light); font-size: 14px; margin-bottom: 14px; line-height: 1.4; }
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            overflow: hidden; margin-bottom: 14px; box-shadow: var(--shadow-sm);
        }
        .card a, .card button.row {
            display: flex; width: 100%; align-items: center; gap: 12px;
            padding: 14px 16px; text-align: left; text-decoration: none; color: inherit;
            background: #fff; border: none; border-bottom: 1px solid #f3f4f6;
            font-size: 15px; font-family: inherit; cursor: pointer;
        }
        .card a:last-child, .card button.row:last-child { border-bottom: none; }
        .card a:active, .card button.row:active { background: #f9fafb; }
        .ico {
            width: 36px; height: 36px; border-radius: 10px; background: #f3f4f6;
            display: grid; place-items: center; font-size: 16px; flex-shrink: 0;
        }
        .meta { flex: 1; min-width: 0; }
        .meta strong { display: block; font-weight: 650; }
        .meta span { display: block; font-size: 12px; color: #6b7280; margin-top: 2px; }
        .chev { color: #9ca3af; font-size: 18px; }
        .empty { padding: 40px 16px; text-align: center; color: #6b7280; }
        .acct {
            padding: 14px 16px 16px; border-bottom: 1px solid #f3f4f6;
        }
        .acct:last-child { border-bottom: none; }
        .acct h2 { font-size: 15px; font-weight: 650; margin-bottom: 4px; }
        .acct p { font-size: 12px; color: #6b7280; line-height: 1.4; margin-bottom: 12px; }
        .acct label { display: block; font-size: 12px; font-weight: 600; margin: 0 0 6px; color: #374151; }
        .acct input {
            width: 100%; padding: 11px 12px; border: 1px solid #e5e7eb; border-radius: 10px;
            font-size: 16px; margin-bottom: 10px; font-family: inherit;
        }
        .acct .btn {
            width: 100%; padding: 12px; border: none; border-radius: 10px; background: #111; color: #fff;
            font-size: 15px; font-weight: 650; cursor: pointer; font-family: inherit;
        }
        .acct .btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .acct .err { color: #b91c1c; font-size: 13px; margin-bottom: 8px; display: none; }
        .acct .err.show { display: block; }
        .acct .ok { color: #047857; font-size: 13px; margin-bottom: 8px; display: none; }
        .acct .ok.show { display: block; }
        @media (min-width: 769px) {
            .desk-hint { display: block; margin-bottom: 12px; font-size: 13px; color: #6b7280; }
        }
        @media (max-width: 768px) {
            .desk-hint { display: none; }
        }
    </style>
</head>
<body>
    <div id="appSplash" aria-hidden="true"><img src="/icon-192.png" alt=""><span>opsAi</span></div>
    <header>
        <h1>More</h1>
        <select id="storeSelect" aria-label="Business"></select>
    </header>
    <main id="app"><div class="empty">Loading…</div></main>
<script>
(function () {
    let storeId = new URLSearchParams(location.search).get('storeId') || '';
    let account = null;

    function q() {
        return storeId ? ('?storeId=' + encodeURIComponent(storeId)) : '';
    }

    function bindDesktopLogin() {
        var form = document.getElementById('desktopLoginForm');
        if (!form) return;
        var err = document.getElementById('desktopLoginErr');
        var ok = document.getElementById('desktopLoginOk');
        var btn = document.getElementById('desktopLoginBtn');
        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            err.classList.remove('show');
            ok.classList.remove('show');
            var email = document.getElementById('desktopEmail').value.trim();
            var password = document.getElementById('desktopPassword').value;
            var passwordConfirm = document.getElementById('desktopPasswordConfirm').value;
            if (password !== passwordConfirm) {
                err.textContent = 'Passwords do not match';
                err.classList.add('show');
                return;
            }
            btn.disabled = true;
            try {
                var res = await fetch('/api/auth/credentials', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email: email, password: password, passwordConfirm: passwordConfirm }),
                });
                var data = await res.json();
                if (!res.ok || !data.success) {
                    err.textContent = data.error || 'Could not save desktop login';
                    err.classList.add('show');
                    return;
                }
                account = data.user || account;
                try { if (data.user) localStorage.setItem('user', JSON.stringify(data.user)); } catch (x) {}
                ok.textContent = 'Saved. You can sign in on a computer with that email.';
                ok.classList.add('show');
                render();
            } catch (x) {
                err.textContent = 'Network error. Try again.';
                err.classList.add('show');
            } finally {
                btn.disabled = false;
            }
        });
    }

    function signedInLabel() {
        if (!account) return 'Not signed in';
        if (account.email) return String(account.email);
        if (account.phoneE164) return String(account.phoneE164);
        if (account.name) return String(account.name);
        return 'Signed in';
    }

    function render() {
        var html = '<p class="desk-hint">Day-to-day work is chat. This page is profile and rare setup.</p>';
        html += '<p class="lead">Talk to Zar first — agents work in the thread.</p>';

        html += '<div class="card">';
        html += '<a href="/crew' + q() + '"><span class="ico">◎</span><div class="meta"><strong>Chat</strong><span>Talk to your agent</span></div><span class="chev">›</span></a>';
        html += '</div>';

        html += '<div class="card">';
        html += '<div class="acct" style="padding:14px 16px 10px;border-bottom:1px solid var(--border, #e5e5e5);">';
        html += '<h2 style="margin:0 0 4px;font-size:15px;">Profile</h2>';
        html += '<p style="margin:0;font-size:14px;">Signed in as <strong>' + String(signedInLabel()).replace(/</g, '') + '</strong></p>';
        if (account && account.email && account.phoneE164) {
            html += '<p class="muted" style="margin:4px 0 0;font-size:13px;">WhatsApp ' + String(account.phoneE164).replace(/</g, '') + '</p>';
        }
        html += '</div>';
        html += '<a href="/tasks' + q() + '&view=setup"><span class="ico">⚙️</span><div class="meta"><strong>Business admin</strong><span>People, hours, tools, reminders</span></div><span class="chev">›</span></a>';
        html += '<a href="/tasks' + q() + '&view=setup&panel=admin-crew"><span class="ico">◈</span><div class="meta"><strong>Agent setup</strong><span>Name, capabilities, tools</span></div><span class="chev">›</span></a>';
        html += '<a href="/billing"><span class="ico">💳</span><div class="meta"><strong>Billing</strong><span>Plan and usage</span></div><span class="chev">›</span></a>';
        html += '</div>';

        html += '<div class="card">';
        html += '<a href="/tasks' + q() + '"><span class="ico">☰</span><div class="meta"><strong>Tasks &amp; alerts</strong><span>Open work and proof</span></div><span class="chev">›</span></a>';
        html += '<a href="/dashboard' + q() + '"><span class="ico">📈</span><div class="meta"><strong>Reports</strong><span>Closes, invoices, standing</span></div><span class="chev">›</span></a>';
        html += '</div><div class="card">';
        if (account && account.canAddDesktopLogin) {
            html += '<div class="acct"><h2>Desktop login</h2>';
            html += '<p>Add an email and password so you can open the same account on a computer. Do not create a second signup.</p>';
            html += '<div class="err" id="desktopLoginErr" role="alert"></div>';
            html += '<div class="ok" id="desktopLoginOk"></div>';
            html += '<form id="desktopLoginForm">';
            html += '<label for="desktopEmail">Email</label>';
            html += '<input type="email" id="desktopEmail" required autocomplete="email" placeholder="you@business.com">';
            html += '<label for="desktopPassword">Password</label>';
            html += '<input type="password" id="desktopPassword" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">';
            html += '<label for="desktopPasswordConfirm">Confirm password</label>';
            html += '<input type="password" id="desktopPasswordConfirm" required autocomplete="new-password" minlength="8" placeholder="••••••••">';
            html += '<button type="submit" class="btn" id="desktopLoginBtn">Save email &amp; password</button>';
            html += '</form></div>';
        } else if (account && account.email) {
            html += '<div class="acct"><h2>Desktop login</h2>';
            html += '<p>Computer sign-in: <strong>' + String(account.email).replace(/</g, '') + '</strong>. WhatsApp login stays on this account.</p></div>';
        }
        html += '<button type="button" class="row" id="logoutBtn"><span class="ico">⎋</span><div class="meta"><strong>Log out</strong><span>Sign out of this device</span></div><span class="chev">›</span></button>';
        html += '</div>';
        document.getElementById('app').innerHTML = html;
        document.getElementById('logoutBtn').addEventListener('click', function () {
            if (window.opsai && window.opsai.logout) window.opsai.logout();
            else location.href = '/login';
        });
        bindDesktopLogin();
    }

    (async function boot() {
        try {
            const meRes = await fetch('/api/auth/me', { credentials: 'same-origin' });
            if (meRes.status === 401) { location.href = '/login'; return; }
            const meData = await meRes.json();
            account = meData && meData.user ? meData.user : null;

            const res = await fetch('/api/stores', { credentials: 'same-origin' });
            if (res.status === 401) { location.href = '/login'; return; }
            const data = await res.json();
            const stores = Array.isArray(data.stores) ? data.stores : [];
            const select = document.getElementById('storeSelect');
            select.innerHTML = '';
            if (!stores.length) {
                document.getElementById('app').innerHTML = '<div class="empty">No businesses yet. <a href="/onboarding">Finish setup</a></div>';
                return;
            }
            stores.forEach(function (s) {
                const o = document.createElement('option');
                o.value = s.storeId;
                o.textContent = s.storeName;
                select.appendChild(o);
            });
            if (!stores.some(function (s) { return s.storeId === storeId; })) storeId = stores[0].storeId;
            select.value = storeId;
            select.addEventListener('change', function () {
                storeId = select.value;
                history.replaceState(null, '', '/more?storeId=' + encodeURIComponent(storeId));
                render();
                // Refresh tab bar links with new storeId
                location.reload();
            });
            history.replaceState(null, '', '/more?storeId=' + encodeURIComponent(storeId));
            render();
        } catch (e) {
            document.getElementById('app').innerHTML = '<div class="empty">Could not load.</div>';
        }
    })();
})();
</script>
</body>
</html>
