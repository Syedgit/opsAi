<!DOCTYPE html>
<html lang="en" data-app-shell="app">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <meta name="color-scheme" content="light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="opsAi">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icon-180.png">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="stylesheet" href="/app-shell.css?v=6">
    <link rel="stylesheet" href="/app-ui.css?v=2">
    <script src="/app-shell.js?v=6"></script>
    <title>opsAi · Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: var(--font);
            background: #f7f7f8;
            color: var(--text);
            min-height: 100dvh;
            font-size: 15px;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            padding-top: max(10px, env(safe-area-inset-top));
            background: rgba(255,255,255,.86);
            border-bottom: 1px solid #ececec;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .topbar h1 {
            font-size: 14px;
            font-weight: 650;
            letter-spacing: -0.02em;
            color: #111;
            min-width: 0;
        }
        .topbar .lead-meta {
            color: #8b8b8b;
            font-weight: 500;
            font-size: 13px;
        }
        .topbar select {
            margin-left: auto;
            padding: 7px 10px;
            border-radius: 8px;
            border: 1px solid #e5e5e5;
            font-size: 13px;
            font-family: inherit;
            background: #fff;
            max-width: min(220px, 46vw);
        }
        .topbar .ghost {
            border: none;
            background: transparent;
            color: #6b7280;
            font-size: 13px;
            padding: 6px 8px;
            cursor: pointer;
            font-family: inherit;
            border-radius: 8px;
        }
        .topbar .ghost:hover { background: #f3f3f3; color: #111; }
        .notice { padding: 10px 14px; border-radius: 8px; font-size: 14px; margin: 10px 16px 0; }
        .notice.err { background: #fee2e2; color: #991b1b; }
        .notice.ok { background: #d1fae5; color: #065f46; }

        #app {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .thread {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        .msg {
            display: grid;
            grid-template-columns: 32px minmax(0, 1fr);
            gap: 14px;
            align-items: start;
            width: 100%;
        }
        .msg.you {
            grid-template-columns: minmax(0, 1fr);
            justify-items: end;
        }
        .msg .avatar {
            width: 32px;
            height: 32px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            background: #0f766e;
            flex-shrink: 0;
        }
        .msg .body { min-width: 0; }
        .msg .who-line {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }
        .msg .who-line strong {
            font-size: 13px;
            font-weight: 650;
            color: #111;
        }
        .msg .chip {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            background: #f0f0f0;
            padding: 1px 7px;
            border-radius: 999px;
        }
        .msg .text {
            font-size: 15px;
            line-height: 1.65;
            color: #1a1a1a;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.you .text {
            background: #f4f4f5;
            border: 1px solid #ececec;
            padding: 10px 14px;
            border-radius: 18px 18px 4px 18px;
            max-width: min(560px, 92%);
        }
        .msg.thinking .text {
            color: #8b8b8b;
            font-style: italic;
        }
        .empty-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 48px 24px 24px;
            gap: 10px;
            color: #6b7280;
        }
        .empty-hero .mark {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #0f766e;
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 6px;
        }
        .empty-hero h2 {
            font-size: 22px;
            font-weight: 650;
            letter-spacing: -0.03em;
            color: #111;
        }
        .empty-hero p {
            max-width: 28rem;
            font-size: 14px;
            line-height: 1.5;
        }
        .suggest {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 14px;
            max-width: 36rem;
        }
        .suggest button {
            border: 1px solid #e5e5e5;
            background: #fff;
            color: #374151;
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
        }
        .suggest button:hover { background: #f9fafb; border-color: #d1d5db; }

        .composer-wrap {
            flex-shrink: 0;
            padding: 8px 16px max(16px, env(safe-area-inset-bottom));
            background: linear-gradient(180deg, rgba(247,247,248,0) 0%, #f7f7f8 28%);
        }
        .composer {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 780px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 18px;
            padding: 10px 10px 10px 14px;
            box-shadow: 0 8px 28px rgba(15, 23, 42, 0.06);
        }
        .composer:focus-within {
            border-color: #cfcfcf;
            box-shadow: 0 10px 32px rgba(15, 23, 42, 0.09);
        }
        .composer textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 160px;
            padding: 6px 0;
            font-size: 15px;
            line-height: 1.45;
            font-family: inherit;
            background: transparent;
            color: #111;
        }
        .composer textarea::placeholder { color: #9ca3af; }
        .composer .send {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: none;
            background: #111;
            color: #fff;
            cursor: pointer;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            font-size: 16px;
            line-height: 1;
        }
        .composer .send:disabled {
            background: #e5e5e5;
            color: #9ca3af;
            cursor: default;
        }
        .composer-hint {
            text-align: center;
            font-size: 11px;
            color: #a1a1aa;
            margin-top: 8px;
        }
        .composer-hint a { color: #71717a; }
        .blocked {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            padding: 16px;
        }
        .blocked a { color: #111; }
        .empty-state { padding: 48px 24px; text-align: center; color: #6b7280; }
        @media (max-width: 768px) {
            .topbar .desk-only { display: none !important; }
            .messages { padding: 18px 14px 8px; gap: 18px; }
            .composer-wrap { padding-left: 12px; padding-right: 12px; }
        }
    </style>
</head>
<body>
    <div id="appSplash" aria-hidden="true"><img src="/icon-192.png" alt=""><span>opsAi</span></div>
    <div class="topbar">
        <h1 id="topLead">Chat <span class="lead-meta" id="topRole"></span></h1>
        <select id="storeSelect" aria-label="Business"></select>
        <button type="button" class="ghost desk-only" id="logoutBtn">Log out</button>
    </div>
    <div id="notice"></div>
    <main id="app"><div class="empty-state">Loading…</div></main>

<script>
(function () {
    let storeId = new URLSearchParams(location.search).get('storeId') || '';
    let board = null;
    const THREAD = 'supervisor';
    const threads = {};
    var lastAskByThread = {};

    if (window.opsai) {
        window.opsai.me().then(function (d) { if (!d) location.href = '/login'; });
    }

    function esc(value) {
        return String(value === null || value === undefined ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function initials(name) {
        return String(name || '?').trim().slice(0, 1).toUpperCase();
    }

    function note(kind, text) {
        document.getElementById('notice').innerHTML = text
            ? '<div class="notice ' + kind + '">' + esc(text) + '</div>'
            : '';
    }

    function authHeaders() {
        return { 'Content-Type': 'application/json' };
    }

    async function loadBoard() {
        const qs = new URLSearchParams({ storeId: storeId }).toString();
        const res = await fetch('/api/stores/tasks?' + qs, { headers: authHeaders() });
        if (res.status === 401) { location.href = '/login'; return null; }
        const data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.error || ('Server answered ' + res.status));
        return data;
    }

    function lead() {
        const agents = (board && board.agents) || {};
        const base = agents.supervisor || {
            id: 'supervisor',
            role: 'Ops lead',
            enabled: true,
        };
        return Object.assign({}, base, {
            name: agents.leadName || base.name || 'Zar',
        });
    }

    function threadKey() {
        return String(storeId || '') + ':' + THREAD;
    }

    function storageKey(kind, key) {
        return 'opsai.crew.' + kind + '.' + key;
    }

    function loadStoredThread(key) {
        try {
            const raw = sessionStorage.getItem(storageKey('thread', key));
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
            return [];
        }
    }

    function saveThread(key, list) {
        try {
            sessionStorage.setItem(storageKey('thread', key), JSON.stringify(list.slice(-40)));
        } catch (e) { /* ignore */ }
    }

    function ensureThread() {
        const key = threadKey();
        if (!threads[key]) threads[key] = loadStoredThread(key);
        return threads[key];
    }

    function getLastAsk() {
        const key = threadKey();
        if (lastAskByThread[key]) return lastAskByThread[key];
        try {
            const raw = sessionStorage.getItem(storageKey('lastAsk', key));
            if (!raw) return null;
            const parsed = JSON.parse(raw);
            if (parsed && parsed.toolId) {
                lastAskByThread[key] = parsed;
                return parsed;
            }
        } catch (e) { /* ignore */ }
        return null;
    }

    function setLastAsk(lastAsk) {
        if (!lastAsk || !lastAsk.toolId) return;
        const key = threadKey();
        lastAskByThread[key] = lastAsk;
        try {
            sessionStorage.setItem(storageKey('lastAsk', key), JSON.stringify(lastAsk));
        } catch (e) { /* ignore */ }
    }

    function booksOn() {
        const planOn = !!(board.plan && board.plan.features && board.plan.features.booksLookups) ||
            !!(board.aiChat && board.aiChat.includedInPlan) ||
            !!(board.agents && board.agents.planIncludesBooks);
        const optedOut = !!(board.aiChat && board.aiChat.optedOut);
        if (planOn && !optedOut) return true;
        return !!(board.agents && board.agents.enabled && board.agents.enabled.books) ||
            !!(board.aiChat && board.aiChat.enrolled);
    }

    function canOwnerChat() {
        return !!(board && (board.canEdit || board.canManageOwners));
    }

    function welcomeText() {
        if (booksOn()) {
            return 'Ask about sales, bills, what’s due — I look things up for you.';
        }
        return 'I’m your ops chat on Standard. Ask what’s due today — upgrade to Pro for sales and invoice look-ups.';
    }

    function historyPayload() {
        return ensureThread()
            .filter(function (m) { return m.role === 'you' || m.role === 'agent'; })
            .filter(function (m) { return m.text && m.text !== 'Thinking…'; })
            .slice(-10)
            .map(function (m) {
                return { role: m.role === 'you' ? 'user' : 'assistant', text: m.text };
            });
    }

    function persistThread() {
        saveThread(threadKey(), ensureThread());
    }

    function resizeComposer(el) {
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = Math.min(160, el.scrollHeight) + 'px';
    }

    function bindComposer() {
        const ta = document.querySelector('#crewForm textarea');
        const send = document.getElementById('crewSend');
        if (!ta) return;
        const sync = function () {
            resizeComposer(ta);
            if (send) send.disabled = !ta.value.trim();
        };
        ta.addEventListener('input', sync);
        ta.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const form = document.getElementById('crewForm');
                if (form && ta.value.trim()) form.requestSubmit();
            }
        });
        sync();
        ta.focus();
    }

    function renderMessages() {
        const list = ensureThread();
        const msgs = document.getElementById('messages');
        const who = lead();
        if (!msgs) return;
        if (!list.length) {
            msgs.innerHTML =
                '<div class="empty-hero">' +
                '<div class="mark">' + esc(initials(who.name)) + '</div>' +
                '<h2>Hi, I’m ' + esc(who.name || 'Zar') + '</h2>' +
                '<p>' + esc(welcomeText()) + '</p>' +
                '<div class="suggest">' +
                '<button type="button" data-suggest="Anything to follow today?">Anything to follow today?</button>' +
                (booksOn()
                    ? '<button type="button" data-suggest="How was sale today?">How was sale today?</button>' +
                      '<button type="button" data-suggest="What invoices are still open?">Open invoices</button>'
                    : '<button type="button" data-suggest="What can you help with?">What can you help with?</button>') +
                '</div>' +
                '</div>';
            return;
        }
        msgs.innerHTML = list.map(function (m) {
            if (m.role === 'you') {
                return '<div class="msg you"><div class="text">' + esc(m.text) + '</div></div>';
            }
            const thinking = m.text === 'Thinking…';
            return (
                '<div class="msg agent' + (thinking ? ' thinking' : '') + '">' +
                '<div class="avatar">' + esc(initials(who.name)) + '</div>' +
                '<div class="body">' +
                '<div class="who-line"><strong>' + esc(who.name || 'Zar') + '</strong>' +
                (m.chip ? '<span class="chip">' + esc(m.chip) + '</span>' : '') +
                '</div>' +
                '<div class="text">' + esc(m.text) + '</div>' +
                '</div></div>'
            );
        }).join('');
        msgs.scrollTop = msgs.scrollHeight;
    }

    function render() {
        const who = lead();
        document.getElementById('topLead').innerHTML =
            esc(who.name || 'Zar') +
            '<span class="lead-meta" id="topRole">' +
            (who.role ? ' · ' + esc(who.role) : '') +
            '</span>';

        if (!(board && board.agents)) {
            document.getElementById('app').innerHTML =
                '<div class="empty-state">No agents on this business yet. Open <a href="/tasks?storeId=' +
                encodeURIComponent(storeId) + '&view=setup&panel=admin-crew">Agent setup</a>.</div>';
            return;
        }

        const chatOk = canOwnerChat();
        const setupHref = '/tasks?storeId=' + encodeURIComponent(storeId) + '&view=setup&panel=admin-crew';

        let html = '<section class="thread"><div class="messages" id="messages"></div><div class="composer-wrap">';
        if (chatOk) {
            html +=
                '<form class="composer" id="crewForm">' +
                '<textarea name="question" rows="1" maxlength="500" required placeholder="Message ' +
                esc(who.name || 'Zar') + '…"></textarea>' +
                '<button type="submit" class="send" id="crewSend" disabled aria-label="Send">↑</button>' +
                '</form>' +
                '<div class="composer-hint">Enter to send · Shift+Enter for a new line · <a href="' +
                setupHref + '">Agent setup</a>' +
                (booksOn() ? '' : ' · <a href="/billing">Pro for books look-ups</a>') +
                '</div>';
        } else {
            html += '<div class="blocked">Owner or manager sign-in required for chat.</div>';
        }
        html += '</div></section>';
        document.getElementById('app').innerHTML = html;
        renderMessages();
        bindComposer();
    }

    async function askCrew(question) {
        const res = await fetch('/api/stores/ask', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({
                storeId: storeId,
                question: question,
                history: historyPayload(),
                lastAsk: getLastAsk(),
                agentId: 'supervisor',
            }),
        });
        if (res.status === 401) { location.href = '/login'; return null; }
        const data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.error || ('Server answered ' + res.status));
        if (data.lastAsk) setLastAsk(data.lastAsk);
        return data;
    }

    async function sendQuestion(question) {
        const q = String(question || '').trim();
        if (!q) return;
        const thread = ensureThread();
        const who = lead();
        const form = document.getElementById('crewForm');
        const ta = form && form.querySelector('textarea');
        thread.push({ role: 'you', text: q });
        if (ta) {
            ta.value = '';
            resizeComposer(ta);
            const send = document.getElementById('crewSend');
            if (send) send.disabled = true;
        }
        renderMessages();
        thread.push({ role: 'agent', text: 'Thinking…' });
        renderMessages();
        try {
            const data = await askCrew(q);
            thread.pop();
            const chip = (data.agent && data.agent !== who.name)
                ? (data.agent + (data.toolId ? ' · ' + data.toolId : ''))
                : (data.toolId ? String(data.toolId).replace(/_/g, ' ') : '');
            thread.push({ role: 'agent', text: data.answer || 'No answer.', chip: chip || null });
        } catch (err) {
            thread.pop();
            thread.push({ role: 'agent', text: err.message || 'Could not ask.' });
        }
        persistThread();
        renderMessages();
        if (ta) ta.focus();
    }

    document.addEventListener('submit', function (e) {
        if (e.target.id !== 'crewForm') return;
        e.preventDefault();
        const f = new FormData(e.target);
        sendQuestion(f.get('question'));
    });

    document.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-suggest]');
        if (!btn) return;
        sendQuestion(btn.getAttribute('data-suggest'));
    });

    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async function () {
            try { await fetch('/api/auth/logout', { method: 'POST', headers: authHeaders() }); } catch (e) { /* ignore */ }
            location.href = '/login';
        });
    }

    (async function boot() {
        try {
            const res = await fetch('/api/stores', { headers: authHeaders() });
            if (res.status === 401) { location.href = '/login'; return; }
            const data = await res.json();
            const stores = Array.isArray(data.stores) ? data.stores : [];
            const select = document.getElementById('storeSelect');
            select.innerHTML = '';
            if (!stores.length) {
                document.getElementById('app').innerHTML = '<div class="empty-state">No businesses yet.</div>';
                return;
            }
            stores.forEach(function (s) {
                const o = document.createElement('option');
                o.value = s.storeId;
                o.textContent = s.storeName + ' (' + s.storeId + ')';
                select.appendChild(o);
            });
            if (!stores.some(function (s) { return s.storeId === storeId; })) storeId = stores[0].storeId;
            select.value = storeId;
            history.replaceState(null, '', '/crew?storeId=' + encodeURIComponent(storeId));
            select.addEventListener('change', async function () {
                storeId = select.value;
                history.replaceState(null, '', '/crew?storeId=' + encodeURIComponent(storeId));
                note('', '');
                board = await loadBoard();
                render();
            });
            board = await loadBoard();
            render();
        } catch (e) {
            note('err', 'Could not load chat. ' + e.message);
            document.getElementById('app').innerHTML = '';
        }
    })();
})();
</script>
</body>
</html>
